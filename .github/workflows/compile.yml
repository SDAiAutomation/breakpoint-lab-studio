name: Compilation (16:9 long video from finished episodes)

# Takes the published episodes from Drive (by file id), cuts each before its next-test promise, lays them in a
# 16:9 frame (tools/compile.py), uploads the MP4 + description + review sheet to Drive, and pushes the review sheet
# and key frames to the branch previews/<run id>. No new render.
on:
  workflow_dispatch:
    inputs:
      spec_path:
        description: "Compilation spec (in the repo)"
        default: "configs/compilations/compilation_001_guess_all_6_en.json"

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg rclone > /dev/null
          pip install -q pillow
          mkdir -p ~/.config/rclone && printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
      - name: Episodes from Drive
        run: |
          REMOTE=$(rclone listremotes | head -1)
          mkdir -p work
          python3 -c "import json;[print(s['drive_id']) for s in json.load(open('${{ inputs.spec_path }}'))['segments']]" > ids.txt
          i=0
          while read -r id; do
            rclone backend copyid "$REMOTE" "$id" "work/src_$i.mp4"
            ls -la "work/src_$i.mp4"
            i=$((i+1))
          done < ids.txt
      - name: Compile
        run: python3 tools/compile.py "${{ inputs.spec_path }}" work
      - name: Upload to Google Drive
        run: |
          REMOTE=$(rclone listremotes | head -1)
          ID=$(python3 -c "import json;print(json.load(open('${{ inputs.spec_path }}'))['id'])")
          NAME="$(date -u +%Y-%m-%d)_${ID}_run${{ github.run_number }}"
          rclone copyto work/compilation.mp4 "${REMOTE}${NAME}.mp4" --drive-root-folder-id "$DRIVE_FOLDER_ID"
          rclone copyto work/description.txt "${REMOTE}${NAME}_description.txt" --drive-root-folder-id "$DRIVE_FOLDER_ID"
          rclone copyto work/review.png "${REMOTE}${NAME}_review.png" --drive-root-folder-id "$DRIVE_FOLDER_ID"
          echo "$NAME"
      - name: Push review to previews/<run>
        run: |
          B="previews/${{ github.run_id }}"
          mkdir -p /tmp/pv && cp work/review.png work/description.txt work/stills/*.png /tmp/pv/
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "$B" && git rm -rfq . && cp /tmp/pv/* . && git add -A && git commit -qm "Compilation review ${{ github.run_id }}" && git push -q origin "$B"
