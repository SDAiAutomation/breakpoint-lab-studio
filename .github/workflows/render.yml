name: Render Breakpoint Lab video

# Breakpoint Lab (@BreakpointLabTV) — séries Tests (engine/engine.html) et Physics (engine/physics.html).
# prepare (timeline + découpage) -> render (N machines, une tranche de frames chacune)
# -> finalize (son, MP4, Google Drive, historique)

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: "Config du test (dans le dépôt)"
        default: "configs/concrete_c30_37_en.json"
      config_json:
        description: "Ou config complète en JSON (prioritaire) - utilisé par la tâche quotidienne Claude"
        default: ""
      frames_per_machine:
        description: "Frames par machine (moins = plus de machines en parallèle)"
        default: "160"
      drive_from_run:
        description: "Reprise : id d'un run dont le MP4 est resté en artefact -> l'envoie seulement sur Drive"
        default: ""
      sound_from_run:
        description: "Son seul : id d'un run fini -> refait le son (Openverse + earshot + real-sfx) sans refaire les images"
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

env:
  DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}   # variable du dépôt : id du dossier Drive « Breakpoint Lab » (vide -> vidéo en artefact GitHub)
  PLAYWRIGHT_VERSION: "1.50.1"

jobs:
  prepare:
    if: inputs.drive_from_run == '' && inputs.sound_from_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      shards: ${{ steps.shards.outputs.list }}
      tag: ${{ steps.shards.outputs.tag }}
      blender: ${{ steps.shards.outputs.blender }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Playwright + Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@${PLAYWRIGHT_VERSION}
          npx playwright install --with-deps chromium
      - name: Config
        env:
          CONFIG_JSON: ${{ inputs.config_json }}
          CONFIG_PATH: ${{ inputs.config_path }}
        run: |
          mkdir -p work
          if [ -n "$CONFIG_JSON" ]; then printf '%s' "$CONFIG_JSON" > work/config.json; else cp "$CONFIG_PATH" work/config.json; fi
          python3 -c "import json;c=json.load(open('work/config.json'));assert c.get('source'), 'config sans source : refusé (chaque chiffre doit être sourcé)';assert c.get('description'), 'config sans description : refusé (explication de l expérience pour le .txt)'"
          python3 tools/check_config.py work/config.json
      - name: Timeline + stills
        run: |
          node engine/render.js timeline work/config.json work/timeline.json
          python3 - <<'EOF'
          import json
          tl = json.load(open("work/timeline.json"))
          ts = [1.5] + [e["t"] + 0.6 for e in tl["events"] if e["type"] == "break"] + [tl["duration"] - 2.5]
          open("work/stills.txt", "w").write(",".join(f"{t:.2f}" for t in ts))
          EOF
          node engine/render.js stills work/config.json work/previews "$(cat work/stills.txt)"
      - name: Comfort review sheet (stills + what the phone draws on top)
        run: |
          pip install -q pillow
          python3 tools/review_sheet.py work/previews work/review_sheet.png
      - name: Cover image (Instagram / profile grid)
        run: |
          T=$(python3 tools/cover.py time work/config.json work/timeline.json)
          node engine/render.js clean work/config.json work/cover_scene.png "$T"
          python3 tools/cover.py build work/config.json work/cover_scene.png work/cover.jpg
      - name: Split frames across machines
        id: shards
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          tl = json.load(open("work/timeline.json")); n = tl["frames"]; per = int("${{ inputs.frames_per_machine || '160' }}")
          cfg = json.load(open("work/config.json"))
          print("list=" + json.dumps([f"{a}-{min(a + per, n) - 1}" for a in range(0, n, per)]))
          P = len(tl.get("poses", [])); bp = 18                    # Blender scene images (bottle engine): 18 per machine
          print("blender=" + json.dumps([f"{a}-{min(a + bp, P) - 1}" for a in range(0, P, bp)]))
          print("tag=" + cfg.get("id", "qc"))
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: qc-work
          path: work/
          retention-days: 1

  blender:
    needs: prepare
    if: needs.prepare.outputs.blender != '[]' && needs.prepare.outputs.blender != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        poses: ${{ fromJSON(needs.prepare.outputs.blender) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: qc-work
          path: work
      - uses: actions/cache@v4
        with:
          path: /tmp/blender-5.3.0-linux-x64.tar.xz
          key: blender-5.3.0
      - name: Blender
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libegl1 > /dev/null
          F="blender-5.3.0-linux-x64.tar.xz"
          if [ ! -s "/tmp/$F" ]; then for U in "https://download.blender.org/release/Blender5.3/$F" "https://mirrors.ocf.berkeley.edu/blender/release/Blender5.3/$F" \
                   "https://ftp.halifax.rwth-aachen.de/blender/release/Blender5.3/$F" "https://mirror.clarkson.edu/blender/release/Blender5.3/$F"; do
            for i in 1 2; do curl -sSfL --retry 3 -o "/tmp/$F" "$U" && break 2; echo "retry $U"; sleep 10; done
          done; fi
          tar -xJf "/tmp/$F" -C "$HOME"
      - name: Scene images ${{ matrix.poses }} (Cycles CPU)
        run: |
          SCN=$(python3 -c "import json;print(json.load(open('work/config.json')).get('blender_scene','tools/blender/bottle_scene.py'))")
          "$HOME/blender-5.3.0-linux-x64/blender" -b -P "$SCN" -- --poses work/timeline.json --out work/bscene --range ${{ matrix.poses }} --samples 96 2>&1 | grep -E "rendered|Error|Traceback" || true
          echo "$(ls work/bscene/*.jpg | wc -l) images"
          test -n "$(ls work/bscene/*.jpg 2>/dev/null)"
      - name: Shard id
        id: sid
        run: echo "id=$(echo '${{ matrix.poses }}' | tr '-' '_')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: qc-bscene-${{ steps.sid.outputs.id }}
          path: work/bscene/*.jpg
          retention-days: 1

  bpreviews:
    needs: [prepare, blender]
    if: needs.blender.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Playwright + Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@${PLAYWRIGHT_VERSION}
          npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: qc-work
          path: work
      - uses: actions/download-artifact@v4
        with:
          pattern: qc-bscene-*
          path: work/bscene
          merge-multiple: true
      - name: Stills, review sheet and cover with the real scene
        run: |
          rm -rf work/previews && node engine/render.js stills work/config.json work/previews "$(cat work/stills.txt)"
          pip install -q pillow
          python3 tools/review_sheet.py work/previews work/review_sheet.png
          T=$(python3 tools/cover.py time work/config.json work/timeline.json)
          node engine/render.js clean work/config.json work/cover_scene.png "$T"
          python3 tools/cover.py build work/config.json work/cover_scene.png work/cover.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: qc-bprev
          path: |
            work/previews/
            work/review_sheet.png
            work/cover.jpg
          retention-days: 1

  render:
    needs: [prepare, blender]
    if: always() && needs.prepare.result == 'success' && (needs.blender.result == 'success' || needs.blender.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: true
      matrix:
        frames: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Playwright + Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@${PLAYWRIGHT_VERSION}
          npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: qc-work
          path: work
      - uses: actions/download-artifact@v4
        if: needs.blender.result == 'success'
        with:
          pattern: qc-bscene-*
          path: work/bscene
          merge-multiple: true
      - name: Render frames ${{ matrix.frames }}
        run: node engine/render.js frames work/config.json work/frames ${{ matrix.frames }}
      - name: Shard id
        id: sid
        run: echo "id=$(echo '${{ matrix.frames }}' | tr '-' '_')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: qc-frames-${{ steps.sid.outputs.id }}
          path: work/frames/*.jpg
          retention-days: 1

  finalize:
    needs: [prepare, blender, bpreviews, render]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      VIDEO_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Deps
        run: |
          pip install -q numpy scipy
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - uses: actions/download-artifact@v4
        with:
          name: qc-work
          path: work
      - uses: actions/download-artifact@v4
        if: needs.render.result == 'success'
        with:
          pattern: qc-frames-*
          path: work/frames
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: needs.bpreviews.result == 'success'
        with:
          name: qc-bprev
          path: work
      - name: Sound + MP4
        if: needs.render.result == 'success'
        run: |
          python3 engine/audio.py work/timeline.json work/audio.wav
          ffmpeg -v error -y -framerate 30 -i work/frames/f_%05d.jpg -i work/audio.wav \
            -c:v libx264 -preset veryfast -crf 18 -pix_fmt yuv420p -af "alimiter=limit=0.84:level=0" -c:a aac -b:a 192k -shortest work/video.mp4
          python3 engine/caption.py work/config.json work/caption.txt
          ffprobe -v error -show_entries format=duration -of csv=p=0 work/video.mp4
      - name: Real sound? (config "sound.mode" = "real")
        id: realq
        run: python3 -c "import json;print('real=' + str(json.load(open('work/config.json')).get('sound',{}).get('mode') in ('real','hybrid')).lower())" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.realq.outputs.real == 'true'
        with:
          path: |
            ~/.cache/huggingface
            ~/.earshot
          key: earshot-models-v1
      - name: Real sound (Openverse finds, earshot listens, real-sfx places)
        if: needs.render.result == 'success' && steps.realq.outputs.real == 'true'
        run: |
          export EARSHOT_HOME="$HOME/.earshot"
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "earshot[listen,measure,images] @ git+https://github.com/Leonxlnx/earshot"
          git clone -q --depth 1 https://github.com/Clipwing/skills /tmp/clipwing
          cp work/video.mp4 work/video_synth.mp4
          python3 tools/sound/realsound.py work/config.json work/timeline.json work/video_synth.mp4 work/sound \
            --realsfx /tmp/clipwing/skills/real-sfx
          cp work/sound/result/film_sfx.mp4 work/video.mp4
          python3 - <<'EOF'
          import json
          src = json.load(open("work/sound/sources.json"))
          rec = [p for v in src.values() for p in v if p.get("openverse_id")]
          with open("work/caption.txt", "a", encoding="utf-8") as f:
              f.write("\nSound: " + (f"{len(rec)} real recordings (CC0, found on Openverse) placed with real-sfx; " if rec else "")
                      + ("graphic sounds made with earshot.\n" if any(p.get("made_by") for v in src.values() for p in v) else "graphic sounds: Breakpoint Lab.\n"))
          EOF
          cat work/sound/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.realq.outputs.real == 'true'
        with:
          name: qc-${{ needs.prepare.outputs.tag }}-${{ github.run_number }}-sound
          path: |
            work/sound/report.md
            work/sound/sources.json
            work/sound/cues.json
            work/sound/takes/
            work/sound/result/*.md
            work/sound/result/*.json
            work/sound/result/film_sfx_sfx_track.wav
          if-no-files-found: ignore
          retention-days: 14
      - name: YouTube short cut (~40 s, the WHY kept whole)
        if: needs.render.result == 'success'
        run: |
          python3 tools/shortcut.py work/config.json work/timeline.json work/video.mp4 work/video_short.mp4
          python3 tools/sound/tp_guard.py work/video.mp4 work/video_short.mp4
      - name: Upload to Google Drive
        if: needs.render.result == 'success' && env.RCLONE_CONF != '' && env.DRIVE_FOLDER_ID != ''
        run: |
          sudo apt-get install -y -qq rclone > /dev/null
          mkdir -p ~/.config/rclone && printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          REMOTE=$(rclone listremotes | head -1)
          NAME="$(date -u +%Y-%m-%d)_${VIDEO_TAG}_run${GITHUB_RUN_NUMBER}"
          rclone copyto work/video.mp4 "${REMOTE}${NAME}.mp4" --drive-root-folder-id "$DRIVE_FOLDER_ID"
          rclone copyto work/caption.txt "${REMOTE}${NAME}_caption.txt" --drive-root-folder-id "$DRIVE_FOLDER_ID"
          if [ -f work/cover.jpg ]; then rclone copyto work/cover.jpg "${REMOTE}${NAME}_cover.jpg" --drive-root-folder-id "$DRIVE_FOLDER_ID"; fi
          if [ -f work/video_short.mp4 ]; then rclone copyto work/video_short.mp4 "${REMOTE}${NAME}_youtube-short.mp4" --drive-root-folder-id "$DRIVE_FOLDER_ID"; fi
          if [ -f work/video_synth.mp4 ]; then rclone copyto work/video_synth.mp4 "${REMOTE}${NAME}_synth-sound.mp4" --drive-root-folder-id "$DRIVE_FOLDER_ID"; fi
          echo "DRIVE_OK=1" >> "$GITHUB_ENV"
          # making-of : de quoi montrer plus tard « comment on l'a fait » (config, images clés, planche, son)
          MO="${REMOTE}making-of/${NAME}"
          rclone copyto work/config.json "${MO}/config.json" --drive-root-folder-id "$DRIVE_FOLDER_ID"
          rclone copyto work/timeline.json "${MO}/timeline.json" --drive-root-folder-id "$DRIVE_FOLDER_ID"
          [ -f work/review_sheet.png ] && rclone copyto work/review_sheet.png "${MO}/review_sheet.png" --drive-root-folder-id "$DRIVE_FOLDER_ID"
          [ -d work/previews ] && rclone copy work/previews "${MO}/stills" --drive-root-folder-id "$DRIVE_FOLDER_ID"
          for f in report.md sources.json cues.json; do [ -f "work/sound/$f" ] && rclone copyto "work/sound/$f" "${MO}/sound_$f" --drive-root-folder-id "$DRIVE_FOLDER_ID"; done
          true
      - name: Record in history
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os, datetime, subprocess
          cfg = json.load(open("work/config.json"))
          ok = os.path.exists("work/video.mp4")
          row = {"date": datetime.datetime.utcnow().isoformat(timespec="minutes") + "Z",
                 "run_number": int(os.environ["GITHUB_RUN_NUMBER"]), "status": "ok" if ok else "failed",
                 "id": cfg.get("id"), "rounds": [r.get("specimen", "pair") + ":" + r.get("kind", cfg.get("engine", "?")) for r in cfg["rounds"]],
                 "source": cfg.get("source"), "caption": cfg.get("caption", ""),
                 "views": None, "likes": None, "comments": None, "shares": None}
          os.makedirs("history", exist_ok=True)
          with open("history/videos.jsonl", "a", encoding="utf-8") as f:
              f.write(json.dumps(row, ensure_ascii=False) + "\n")
          print(row)
          EOF
          git config user.name "breakpoint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history/videos.jsonl
          git commit -m "history: qc run ${GITHUB_RUN_NUMBER} (${VIDEO_TAG})" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - uses: actions/upload-artifact@v4
        if: always() && env.DRIVE_OK != '1'
        with:
          name: qc-${{ needs.prepare.outputs.tag }}-${{ github.run_number }}-video
          path: |
            work/video.mp4
            work/caption.txt
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qc-${{ needs.prepare.outputs.tag }}-${{ github.run_number }}-previews
          path: |
            work/previews/
            work/review_sheet.png
            work/cover.jpg
          if-no-files-found: ignore
          retention-days: 3
      - name: Delete intermediate artifacts
        # keep the frames when the MP4 failed, so a fix can reuse them
        if: always() && env.DRIVE_OK == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
                        --jq '.artifacts[] | select(.name == "qc-work" or (.name | startswith("qc-frames-"))) | .id'); do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id" && echo "deleted $id"
          done

  drive_upload:
    # reprise quand finalize a échoué à l'envoi Drive : récupère l'artefact *-video du run donné
    if: inputs.drive_from_run != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      GH_TOKEN: ${{ github.token }}
      SRC: ${{ inputs.drive_from_run }}
    steps:
      - name: Download video artifact
        run: |
          NAME=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SRC}/artifacts?per_page=100" \
            --jq '[.artifacts[]|select(.name|endswith("-video"))][0].name')
          test -n "$NAME" && test "$NAME" != "null"
          echo "ART=$NAME" >> "$GITHUB_ENV"
          gh run download "$SRC" -R "$GITHUB_REPOSITORY" -n "$NAME" -D work
          ls -la work
      - name: Upload to Google Drive
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone > /dev/null
          mkdir -p ~/.config/rclone && printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          REMOTE=$(rclone listremotes | head -1)
          RUNNUM=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SRC}" --jq .run_number)
          TAG=$(echo "$ART" | sed -E 's/^qc-//; s/-[0-9]+-video$//')
          NAME="$(date -u +%Y-%m-%d)_${TAG}_run${RUNNUM}"
          rclone copyto work/video.mp4 "${REMOTE}${NAME}.mp4" --drive-root-folder-id "$DRIVE_FOLDER_ID" -v
          rclone copyto work/caption.txt "${REMOTE}${NAME}_caption.txt" --drive-root-folder-id "$DRIVE_FOLDER_ID" -v
          echo "$NAME"

  sound_only:
    # son seul : reprend qc-work + la vidéo du run donné, refait le son réel, envoie sur Drive
    if: inputs.sound_from_run != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg rclone > /dev/null
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "earshot[listen,measure,images] @ git+https://github.com/Leonxlnx/earshot"
          git clone -q --depth 1 https://github.com/Clipwing/skills /tmp/clipwing
      - uses: actions/cache@v4
        with:
          path: ~/.earshot
          key: earshot-models-v1
      - name: Get the render
        run: |
          gh run download ${{ inputs.sound_from_run }} -n qc-work -D work
          NAME=$(gh api repos/${{ github.repository }}/actions/runs/${{ inputs.sound_from_run }}/artifacts --jq '.artifacts[].name' | grep -- '-video$' | head -1)
          gh run download ${{ inputs.sound_from_run }} -n "$NAME" -D work/v
          cp work/v/video.mp4 work/video_synth.mp4
          if [ -n "${{ inputs.config_path }}" ]; then cp "${{ inputs.config_path }}" work/config.json; fi
          echo "TAG=$(python3 -c "import json;print(json.load(open('work/config.json'))['id'])")" >> "$GITHUB_ENV"
      - name: Real sound (Openverse finds, earshot listens, real-sfx places)
        run: |
          export EARSHOT_HOME="$HOME/.earshot"
          python3 tools/sound/realsound.py work/config.json work/timeline.json work/video_synth.mp4 work/sound \
            --realsfx /tmp/clipwing/skills/real-sfx
          python3 engine/caption.py work/config.json work/caption.txt
          python3 - <<'EOF'
          import json
          src = json.load(open("work/sound/sources.json"))
          rec = [p for v in src.values() for p in v if p.get("openverse_id")]
          with open("work/caption.txt", "a", encoding="utf-8") as f:
              f.write("\nSound: " + (f"{len(rec)} real recordings (CC0, found on Openverse) placed with real-sfx; " if rec else "")
                      + ("graphic sounds made with earshot.\n" if any(p.get("made_by") for v in src.values() for p in v) else "graphic sounds: Breakpoint Lab.\n"))
          EOF
          cat work/sound/report.md >> "$GITHUB_STEP_SUMMARY"
          python3 tools/shortcut.py work/config.json work/timeline.json work/sound/result/film_sfx.mp4 work/video_short.mp4
          python3 tools/sound/tp_guard.py work/sound/result/film_sfx.mp4 work/video_short.mp4
      - name: Upload to Google Drive
        if: env.RCLONE_CONF != '' && env.DRIVE_FOLDER_ID != ''
        run: |
          mkdir -p ~/.config/rclone && printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          REMOTE=$(rclone listremotes | head -1)
          NAME="$(date -u +%Y-%m-%d)_${TAG}_run${{ inputs.sound_from_run }}"
          MODE=$(python3 -c "import json;print(json.load(open('work/config.json')).get('sound',{}).get('mode','real'))")
          rclone copyto work/sound/result/film_sfx.mp4 "${REMOTE}${NAME}_${MODE}-sound.mp4" --drive-root-folder-id "$DRIVE_FOLDER_ID"
          rclone copyto work/video_short.mp4 "${REMOTE}${NAME}_youtube-short.mp4" --drive-root-folder-id "$DRIVE_FOLDER_ID"
          rclone copyto work/video_synth.mp4 "${REMOTE}${NAME}_synth-sound.mp4" --drive-root-folder-id "$DRIVE_FOLDER_ID"
          rclone copyto work/caption.txt "${REMOTE}${NAME}_caption.txt" --drive-root-folder-id "$DRIVE_FOLDER_ID"
          if [ -f work/cover.jpg ]; then rclone copyto work/cover.jpg "${REMOTE}${NAME}_cover.jpg" --drive-root-folder-id "$DRIVE_FOLDER_ID"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sound-${{ inputs.sound_from_run }}
          path: |
            work/sound/report.md
