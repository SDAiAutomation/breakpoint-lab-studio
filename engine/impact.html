<!doctype html>
<html><head><meta charset="utf-8">
<!-- Impact engine (Breakpoint Lab "Tests" series): diamond vs steel. Round "scratch": a diamond point drawn
     across a steel block leaves a groove (diamond 10 on the Mohs scale, hammer steel 5-6). Round "hammer"
     on steel: a pendulum hammer dents the block (steel is tough). Round "hammer" on diamond: the hard but
     brittle stone splits along its cleavage planes (toughness about 2 vs 50 MPa.m^0.5).
     Raymarched (WebGL), same overlay style and API as drop.html. The break pattern is illustrative. -->
<style>
@font-face{font-family:P;src:url("fonts/Poppins-Bold.ttf");font-weight:700}
@font-face{font-family:DJ;src:url("fonts/DejaVuSans-Bold.ttf");font-weight:700}
html,body{margin:0;background:#000}canvas{display:block}
</style></head>
<body>
<canvas id="gl" width="1080" height="1920"></canvas>
<canvas id="out" width="1080" height="1920"></canvas>
<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 R;
uniform float camAng, camDist, camH, camTY, camTX;
uniform vec2 shake;
uniform float showCube, dent, scratchX, scratchOn;
uniform float showGem, gemFlip;        // gemFlip 0: crown up (held, point down); 1: table down (point up)
uniform vec3 gemP;                     // girdle centre
uniform float showHolder;
uniform float showHammer, phi;
uniform vec3 pivot;
uniform mat3 pM[8];                    // per piece: world -> gem local rotation
uniform vec3 pP[8];                    // per piece: world position of the piece's local origin
uniform float split;                   // 0 whole, 1 pieces moving
uniform vec4 dust[6];
uniform float crack;
uniform sampler2D logo;

const float RG=0.06, HC=0.0195, BT=0.30, CUBE=0.07;
float sdRoundBox(vec3 p, vec3 b, float r){ vec3 q=abs(p)-b; return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0)-r; }
float sdCylZ(vec3 p, float h, float r){ vec2 d=abs(vec2(length(p.xy),p.z))-vec2(r,h); return min(max(d.x,d.y),0.0)+length(max(d,0.0)); }
float sdCylY(vec3 p, float h, float r){ vec2 d=abs(vec2(length(p.xz),p.y))-vec2(r,h); return min(max(d.x,d.y),0.0)+length(max(d,0.0)); }
float sdCapX(vec3 p, float a, float b, float r){ p.x-=clamp(p.x,a,b); return length(p)-r; }
float hash3(vec3 p){ return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453); }
vec2 opU(vec2 a, vec2 b){ return a.x<b.x?a:b; }
mat2 rot(float a){ float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }

// round brilliant, local frame: girdle at y=0, crown up (table at HC), pavilion down (culet at -RG*tan 40.75)
float gem(vec3 q){
  float d=max(length(q.xz)-RG, abs(q.y)-0.06);
  d=max(d,q.y-HC);
  for(int k=0;k<8;k++){
    float a=float(k)*0.785398+0.392699, c=cos(a), s=sin(a);
    vec3 n1=normalize(vec3(c*0.5664,0.8241,s*0.5664));                 // bezel, 34.5 deg
    d=max(d,dot(q,n1)-RG*0.5664);
    float b=a+0.392699, cb=cos(b), sb=sin(b);
    vec3 n2=normalize(vec3(cb*0.7071,0.7071,sb*0.7071));               // upper girdle, 45 deg
    d=max(d,dot(q,n2)-RG*0.7071*1.004);
    vec3 n3=normalize(vec3(c*0.6528,-0.7576,s*0.6528));                // pavilion main, 40.75 deg
    d=max(d,dot(q,n3)-RG*0.6528);
    vec3 n4=normalize(vec3(cb*0.6691,-0.7431,sb*0.6691));              // lower girdle, 42 deg
    d=max(d,dot(q,n4)-RG*0.6691*1.006);
  }
  return d;
}
const mat3 CLV=mat3(0.57735,0.57735,0.57735, -0.70711,0.70711,0.0, -0.40825,-0.40825,0.81650);   // cleavage frame
vec2 gemPieces(vec3 p){
  vec2 res=vec2(1e5,0.0);
  for(int i=0;i<8;i++){
    vec3 s=vec3(mod(float(i),2.0)<1.0?-1.0:1.0, mod(floor(float(i)/2.0),2.0)<1.0?-1.0:1.0, i<4?-1.0:1.0);
    vec3 q=pM[i]*(p-pP[i]);
    if(length(q)>0.09) { res=opU(res,vec2(length(q)-0.07,0.0)); continue; }
    vec3 f=CLV*q;
    float d=max(gem(gemFlip>0.5?vec3(q.x,-q.y,q.z):q), max(max(-s.x*f.x,-s.y*f.y),-s.z*f.z)-0.0004);
    res=opU(res,vec2(d,30.0));
  }
  return res;
}
vec2 map(vec3 p){
  vec2 res=vec2(p.y,1.0);
  res=opU(res,vec2(sdRoundBox(p-vec3(0.0,BT*0.5,0.0),vec3(0.42,BT*0.5-0.01,0.28),0.01),2.0));               // anvil bench
  if(showCube>0.5){
    vec3 c=p-vec3(0.0,BT+CUBE,0.0);
    float d=sdRoundBox(c,vec3(CUBE-0.004),0.004);
    d=max(d,-(length(p-vec3(0.0,BT+2.0*CUBE+0.040,0.0))-(0.040+0.0065*dent)));                              // hammer dent
    res=opU(res,vec2(d,3.0));
  }
  if(showGem>0.5){
    if(split<0.5){ vec3 q=p-gemP; if(gemFlip>0.5) q.y=-q.y; float bd=length(q)-0.07; res=opU(res,vec2(bd>0.02?bd:gem(q),30.0)); }
    else res=opU(res,gemPieces(p));
    for(int i=0;i<6;i++){ if(dust[i].w>0.0) res=opU(res,vec2(length(p-dust[i].xyz)-dust[i].w*0.6,30.0)); }
  }
  if(showHolder>0.5){                                                                                          // scribe holder (round 1)
    res=opU(res,vec2(sdCylY(p-vec3(gemP.x,gemP.y+0.17,0.0),0.15,0.010),4.0));
    res=opU(res,vec2(sdCylY(p-vec3(gemP.x,gemP.y+HC+0.012,0.0),0.012,0.05)-0.004,5.0));
  }
  if(showHammer>0.5){
    vec3 q=p-pivot; q.xy=rot(-phi)*q.xy;
    res=opU(res,vec2(sdCapX(q,-0.40,0.06,0.015),6.0));                                                        // wooden handle
    res=opU(res,vec2(sdRoundBox(q-vec3(-0.42,0.0,0.0),vec3(0.032,0.060,0.032),0.006),3.0));                   // steel head
    res=opU(res,vec2(sdCylZ(p-pivot,0.05,0.035),7.0));                                                         // pivot hub
    res=opU(res,vec2(sdRoundBox(p-vec3(pivot.x+0.02,(pivot.y+BT)*0.5,-0.07),vec3(0.018,(pivot.y-BT)*0.5,0.018),0.004),7.0));  // post
  }
  return res;
}
vec3 calcNormal(vec3 p){
  vec2 e=vec2(0.0003,-0.0003);
  return normalize(e.xyy*map(p+e.xyy).x+e.yyx*map(p+e.yyx).x+e.yxy*map(p+e.yxy).x+e.xxx*map(p+e.xxx).x);
}
float softShadow(vec3 ro, vec3 rd){
  float res=1.0, t=0.01;
  for(int i=0;i<44;i++){ float h=map(ro+rd*t).x; res=min(res,10.0*h/t); t+=clamp(h,0.006,0.15); if(res<0.002||t>3.0) break; }
  return clamp(res,0.0,1.0);
}
float calcAO(vec3 p, vec3 n){
  float occ=0.0, sca=1.0;
  for(int i=0;i<4;i++){ float h=0.008+0.04*float(i); occ+=(h-map(p+n*h).x)*sca; sca*=0.8; }
  return clamp(1.0-2.0*occ,0.0,1.0);
}
vec3 bg(vec2 uv){ return mix(vec3(0.90,0.92,0.93),vec3(0.80,0.85,0.88),smoothstep(-1.0,1.0,uv.y)); }
vec3 env(vec3 r){
  float k=r.y*0.5+0.5;
  vec3 c=mix(vec3(0.40,0.42,0.46),vec3(0.97,0.98,1.0),smoothstep(0.30,0.80,k));
  float s1=smoothstep(0.86,0.90,dot(r,normalize(vec3(-0.6,0.75,0.35))));
  float s2=smoothstep(0.90,0.93,dot(r,normalize(vec3(0.75,0.45,0.5))));
  float s3=smoothstep(0.95,0.97,dot(r,normalize(vec3(0.1,0.3,-0.95))));
  return c+vec3(1.4)*s1+vec3(0.9)*s2+vec3(0.6)*s3;
}
vec3 gemEnv(vec3 r){                                  // high-contrast studio for the stone: black and white panels = brilliance
  float a=atan(r.z,r.x);
  float k=smoothstep(-0.25,0.25,sin(a*5.0+r.y*7.0))*smoothstep(-0.6,0.1,r.y);
  return mix(vec3(0.05,0.06,0.08),vec3(1.25),k)+env(r)*0.15;
}
vec3 spectral(float h){ return clamp(abs(fract(h+vec3(0.0,0.33,0.67))*6.0-3.0)-1.0,0.0,1.0); }

vec3 shade(vec2 fc){
  vec2 uv=(2.0*fc-R)/R.y;
  vec3 ta=vec3(camTX,camTY,0.0);
  vec3 ro=ta+vec3(sin(camAng)*camDist,camH,cos(camAng)*camDist);
  ro.xy+=shake; ta.xy+=shake*0.6;
  vec3 ww=normalize(ta-ro), uu=normalize(cross(ww,vec3(0,1,0))), vv=cross(uu,ww);
  vec3 rd=normalize(uv.x*uu+uv.y*vv+2.35*ww);
  vec3 sky=bg(uv), col=sky;
  float t=0.0; vec2 h=vec2(0.0); bool hit=false;
  for(int i=0;i<220;i++){ h=map(ro+rd*t); if(h.x<0.0002*t){hit=true;break;} t+=h.x*0.85; if(t>20.0) break; }
  if(hit){
    vec3 p=ro+rd*t, n=calcNormal(p);
    vec3 sun=normalize(vec3(-0.5,0.95,0.6));
    float sh=softShadow(p+n*0.002,sun), dif=clamp(dot(n,sun),0.0,1.0)*sh, ao=calcAO(p,n);
    vec3 hal=normalize(sun-rd);
    float m=h.y;
    if(m<1.5){ col=sky*mix(0.72,1.0,sh)*mix(0.82,1.0,ao); }
    else if(m>29.5){                                     // diamond: facet reflections + fake dispersion inside
      vec3 rf=reflect(rd,n), tr=refract(rd,n,0.413);
      float fh=hash3(floor(n*9.0+0.5));
      vec3 inside=gemEnv(normalize(tr+0.9*vec3(sin(fh*40.0),cos(fh*23.0),sin(fh*11.0))))*mix(vec3(1.0),spectral(fh)*1.3,0.16);
      float fre=0.17+0.83*pow(1.0-abs(dot(n,rd)),5.0);
      col=mix(inside,gemEnv(rf),fre*0.8);
      col+=vec3(3.5)*pow(clamp(dot(rf,sun),0.0,1.0),400.0)+spectral(fh+0.3)*1.2*pow(clamp(dot(tr,sun),0.0,1.0),60.0);
      col*=mix(0.75,1.0,ao);
      if(crack>0.0){ vec3 q=p-gemP; vec3 f=CLV*q; float cl=min(min(abs(f.x),abs(f.y)),abs(f.z));
        col=mix(col,vec3(1.0),crack*smoothstep(0.003,0.0,cl)); }
    }
    else {
      vec3 alb=vec3(0.8); float sp=0.2, gl=16.0, refl=0.0;
      if(m<2.5){ alb=vec3(0.30,0.31,0.33)*(0.94+0.06*hash3(floor(p*vec3(200.0,40.0,200.0)))); sp=0.9; gl=60.0; refl=0.25;
        if(p.z>0.27&&abs(n.z)>0.9){ vec2 lu=vec2((p.x+0.24)/0.48,(p.y-0.11)/0.08);
          if(lu.x>0.0&&lu.x<1.0&&lu.y>0.0&&lu.y<1.0){ float lg=texture2D(logo,vec2(lu.x,1.0-lu.y)).a; alb=mix(alb,lu.x>0.735?vec3(0.95,0.72,0.08):vec3(0.92),lg); } } }
      else if(m<3.5){ alb=vec3(0.72,0.73,0.76)*(0.95+0.05*hash3(floor(vec3(p.x*800.0,p.y*60.0,p.z*60.0)))); sp=1.4; gl=120.0; refl=0.55;
        if(scratchOn>0.5 && n.y>0.9 && abs(p.y-(BT+2.0*CUBE))<0.002 && abs(p.z)<0.0028 && p.x>-0.05 && p.x<scratchX){
          float e=abs(p.z)/0.0028; alb=mix(vec3(0.12),vec3(0.95),smoothstep(0.55,1.0,e)); refl=0.1; } }
      else if(m<4.5){ alb=vec3(0.15,0.16,0.18); sp=0.8; gl=60.0; refl=0.3; }
      else if(m<5.5){ alb=vec3(0.98,0.74,0.10); sp=0.6; gl=60.0; }
      else if(m<6.5){ vec3 q=p-pivot; q.xy=rot(-phi)*q.xy; alb=vec3(0.62,0.40,0.20)*(0.85+0.15*sin(q.x*260.0+sin(q.z*90.0)*2.0)); sp=0.3; gl=20.0; }
      else { alb=vec3(0.14,0.15,0.17); sp=0.8; gl=60.0; refl=0.2; }
      float amb=0.55+0.45*n.y;
      vec3 lin=1.25*dif*vec3(1.0,0.96,0.90)+0.62*amb*ao*vec3(0.88,0.92,0.98)+0.38*clamp(dot(n,normalize(vec3(0.55,0.25,0.8))),0.0,1.0)*ao;
      col=alb*lin;
      float fre=pow(1.0-clamp(dot(n,-rd),0.0,1.0),4.0);
      col=mix(col,env(reflect(rd,n))*(0.5+0.5*ao),refl*(0.4+0.6*fre));
      col+=sp*pow(clamp(dot(n,hal),0.0,1.0),gl)*dif*vec3(1.0,0.97,0.92);
    }
  }
  col=pow(clamp(col,0.0,1.0),vec3(0.95));
  col*=1.0-0.12*dot(uv*vec2(0.9,0.55),uv*vec2(0.9,0.55));
  return col;
}
void main(){
  vec3 c=shade(gl_FragCoord.xy+vec2(-0.25,0.25))+shade(gl_FragCoord.xy+vec2(0.25,-0.25));
  gl_FragColor=vec4(c*0.5,1.0);
}
</script>
<script>
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const sm=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const lerp=(a,b,t)=>a+(b-a)*t;
const g=9.81;

function drawHandle(c,cfg){
  if(!cfg.handle) return;
  c.save(); c.font='700 24px P, DJ'; c.textBaseline='middle'; c.textAlign='left';
  const tw=c.measureText(cfg.handle).width, gap=12, dot=7, y=256;
  const x=W/2-(tw+gap+2*dot)/2;
  c.fillStyle='#f5c400'; c.beginPath(); c.arc(x+dot,y,dot,0,Math.PI*2); c.fill();
  c.lineWidth=2; c.strokeStyle='rgba(22,24,29,0.85)'; c.stroke();
  c.globalAlpha=0.8; c.fillStyle='#2a2e36'; c.fillText(cfg.handle,x+2*dot+gap,y+1);
  c.restore();
}
function makeLogoTexture(){
  const cv=document.createElement('canvas');cv.width=1400;cv.height=220;const x=cv.getContext('2d');
  x.clearRect(0,0,1400,220);x.font='700 150px P, DJ';x.textAlign='center';x.textBaseline='middle';x.fillStyle='#fff';
  x.fillText('BREAKPOINT',560,118);x.fillText('LAB',1205,118);
  const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,cv);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  return tex;
}

// ---------------------------------------------------------------- scene physics (illustrative)
const BT=0.30, CUBE=0.07, RG=0.06, HC=0.0195, CUL=RG*Math.tan(40.75*Math.PI/180), HL=0.42, HF=0.060;
const PHI0=1.15, TS=0.17;                                   // raised angle, fall time of the hammer
function hammerPhi(rt,target){                             // target: 'steel' (rebounds) or 'gem' (goes through, stops on the bench)
  if(rt<0) return PHI0;
  if(rt<TS){const k=rt/TS;return PHI0*(1-k*k);}
  const a=rt-TS;
  if(target==='steel') return 0.12*Math.exp(-a*5)*Math.abs(Math.sin(a*14));
  const low=-0.16;                                           // continues down after the stone gives way
  if(a<0.05) return lerp(0,low,a/0.05);
  return low+0.05*Math.exp(-(a-0.05)*6)*Math.abs(Math.sin((a-0.05)*16));
}
function rotM(ax,ay,az){                                    // world -> local for R = Rz(az) Ry(ay) Rx(ax); column-major of R^T
  const cx=Math.cos(ax),sx=Math.sin(ax),cy=Math.cos(ay),sy=Math.sin(ay),cz=Math.cos(az),sz=Math.sin(az);
  const Rx=[[1,0,0],[0,cx,-sx],[0,sx,cx]],Ry=[[cy,0,sy],[0,1,0],[-sy,0,cy]],Rz=[[cz,-sz,0],[sz,cz,0],[0,0,1]];
  const mul=(A,B)=>A.map((r,i)=>[0,1,2].map(j=>r[0]*B[0][j]+r[1]*B[1][j]+r[2]*B[2][j]));
  const Wm=mul(Rz,mul(Ry,Rx));
  return [Wm[0][0],Wm[0][1],Wm[0][2],Wm[1][0],Wm[1][1],Wm[1][2],Wm[2][0],Wm[2][1],Wm[2][2]];
}
const CLV=[[0.57735,-0.70711,-0.40825],[0.57735,0.70711,-0.40825],[0.57735,0.0,0.81650]];   // rows = columns of the GLSL mat3 (cleavage axes)
function pieces(rt,gemC){                                   // 8 pieces split by the cleavage planes, flying apart
  const out=[];
  for(let i=0;i<8;i++){
    const s=[i%2?1:-1,(i>>1)%2?1:-1,i<4?-1:1];
    // piece direction in gem-local space: inverse cleavage frame applied to the octant sign
    const dl=[0,1,2].map(r=>CLV[0][r]*s[0]+CLV[1][r]*s[1]+CLV[2][r]*s[2]);
    const dir=[dl[0],-dl[1],dl[2]];                          // gem is flipped (point up)
    const L=Math.hypot(...dir);dir.forEach((v,k)=>dir[k]=v/L);
    const t=Math.max(0,rt), sp=0.55+0.35*((i*37)%5)/5;
    const vy=0.35+0.6*Math.max(dir[1],0)+0.15*((i*13)%3);
    let x=gemC[0]+dir[0]*sp*t, z=gemC[2]+dir[2]*sp*t, y=gemC[1]+dir[1]*0.02+vy*t-0.5*g*t*t;
    const ground=BT+0.012; let spin=t*(8+i*1.7);
    const tl=(vy+Math.sqrt(vy*vy+2*g*Math.max(gemC[1]-ground,0)))/g;
    if(t>tl){const tt=tl;x=gemC[0]+dir[0]*sp*tt+dir[0]*0.08*(1-Math.exp(-(t-tl)*6));z=gemC[2]+dir[2]*sp*tt+dir[2]*0.08*(1-Math.exp(-(t-tl)*6));y=ground;spin=tl*(8+i*1.7);}
    if(t===0){x=gemC[0];y=gemC[1];z=gemC[2];spin=0;}
    out.push({P:[x,y,z],M:rotM(spin*0.7*(i%3-1),spin*0.4,spin*(i%2?1:-1)*0.6)});
  }
  return out;
}

// ---------------------------------------------------------------- timeline
const D_={hook:2.6,title:1.4,show:2.2,question:3.0,go:0.25,scratch:2.6,after:0.5,stampHold:0.9,fact:3.6,explain:10.0,outro:6.5};
const SLOW=1/8;
function buildTimeline(cfg){
  const T={rounds:[],events:[]};let t=0;
  T.hook=[0,D_.hook];t=D_.hook;
  cfg.rounds.forEach((r,i)=>{
    const R={cfg:r,i,start:t};
    T.events.push({type:'round',t});
    R.titleEnd=t+D_.title;R.showEnd=R.titleEnd+D_.show;R.qStart=R.showEnd;R.qEnd=R.qStart+D_.question;
    T.events.push({type:'question',t0:R.qStart,t1:R.qEnd});
    R.go=R.qEnd+D_.go;
    if(r.kind==='scratch'){R.actEnd=R.go+D_.scratch;T.events.push({type:'scratch',t0:R.go+0.2,t1:R.go+D_.scratch-0.3});R.replayT0=R.replayT1=R.actEnd;}
    else {
      R.hitT=R.go+TS;T.events.push({type:'swing',t:R.go});T.events.push({type:r.target==='gem'?'shatter':'clank',t:R.hitT,speed:1});
      R.actEnd=R.hitT+1.4;R.rw=[TS-0.10,TS+0.45];R.replayT0=R.actEnd+0.3;R.replayT1=R.replayT0+(R.rw[1]-R.rw[0])/SLOW;
      T.events.push({type:'replay',t0:R.replayT0,t1:R.replayT1});
      T.events.push({type:r.target==='gem'?'shatter':'clank',t:R.replayT0+(TS-R.rw[0])/SLOW,speed:SLOW});
    }
    R.stampT=R.replayT1+D_.after;T.events.push({type:'stamp',t:R.stampT,color:r.stamp.color});
    R.factT=R.stampT+D_.stampHold;T.events.push({type:'card',t:R.factT});
    R.end=R.factT+D_.fact;t=R.end;T.rounds.push(R);
  });
  T.explain=[t,t+D_.explain];T.events.push({type:'explain',t0:t,t1:t+D_.explain});t+=D_.explain;
  T.outro=[t,t+D_.outro];T.events.push({type:'card',t});T.events.push({type:'cta',t:t+1.4});t+=D_.outro;
  T.duration=t;return T;
}

// ---------------------------------------------------------------- scene state
function sceneState(T,t){
  let R=T.rounds[0];for(const r of T.rounds) if(t>=r.start) R=r;
  const inExplain=t>=T.explain[0];
  if(inExplain) R=T.rounds[T.rounds.length-1];
  const r=R.cfg, s={R,shake:[0,0],replay:false};
  const replay=!inExplain&&R.rw&&t>=R.replayT0&&t<R.replayT1;s.replay=replay;
  let rt;
  if(inExplain) rt=9; else if(replay) rt=R.rw[0]+(t-R.replayT0)*SLOW; else if(R.rw&&t>=R.replayT1) rt=9; else rt=t-R.go;
  s.rt=rt;
  s.showCube=r.kind==='scratch'||r.target==='steel'?1:0;
  s.dent=0;s.scratchX=-0.05;s.scratchOn=0;s.showGem=0;s.gemFlip=0;s.gemP=[0,0,0];s.showHolder=0;s.showHammer=0;s.phi=PHI0;s.pivot=[HL,0.5,0];s.split=0;s.crack=0;
  s.pieces=null;s.dust=[];
  if(r.kind==='scratch'){
    s.showGem=1;s.showHolder=1;s.gemFlip=0;s.scratchOn=1;
    const k=sm(0.2,D_.scratch-0.3,rt), lift=rt<0?0.05*(1-sm(-1.5,0,rt))+0.0:(rt>D_.scratch-0.25?0.05*sm(D_.scratch-0.25,D_.scratch,rt):0);
    const x=lerp(-0.05,0.05,k);s.scratchX=rt<0.2?-0.05:x;
    s.gemP=[x,BT+2*CUBE+CUL+lift+0.0005,0];
  } else {
    s.showHammer=1;
    const top=r.target==='gem'?BT+HC+CUL:BT+2*CUBE;
    s.pivot=[HL,top+HF,0];s.phi=hammerPhi(rt,r.target);
    if(r.target==='steel'){s.dent=sm(TS,TS+0.03,rt);if(R.rw&&!inExplain&&t>=R.replayT1) s.phi=PHI0*sm(R.replayT1,R.replayT1+0.7,t);}   // lift the hammer to show the dent
    else {
      s.showGem=1;s.gemFlip=1;s.gemP=[0,BT+HC,0];
      s.crack=rt>=TS-0.004?1:0;
      if(rt>TS+0.004){s.split=1;s.pieces=pieces(rt-TS-0.004,s.gemP);
        for(let i=0;i<6;i++){const a=i*1.047+0.3,v=0.9+0.25*(i%3),vy=0.8+0.3*(i%2),tt=rt-TS;
          const y=Math.max(BT+0.004,BT+0.03+vy*tt-0.5*g*tt*tt);s.dust.push([Math.cos(a)*v*Math.min(tt,0.35),y,Math.sin(a)*v*Math.min(tt,0.35),0.004+0.002*(i%2)]);}}
    }
    const dt=rt-TS;if(dt>0&&dt<0.3&&!replay){const a=0.006*Math.exp(-dt*18);s.shake=[a*Math.sin(dt*130),a*Math.cos(dt*110)];}
  }
  // camera
  const wide={ang:0.32,dist:1.55,h:0.42,ty:0.42,tx:0.10};
  let cam={...wide};
  if(!inExplain){
    if(t<R.showEnd){const k=sm(R.start,R.showEnd,t);cam={ang:lerp(0.55,0.36,k),dist:lerp(0.75,0.95,k),h:0.14,ty:0.37,tx:0.0};}
    else if(t<R.qEnd){const k=sm(R.qStart,R.qEnd-0.3,t);cam={ang:lerp(0.36,wide.ang,k),dist:lerp(0.95,wide.dist,k),h:lerp(0.14,wide.h,k),ty:lerp(0.37,wide.ty,k),tx:lerp(0,wide.tx,k)};}
    else if(r.kind==='scratch'){const k=sm(R.go,R.go+0.8,t);cam={ang:lerp(wide.ang,0.15,k),dist:lerp(wide.dist,0.62,k),h:lerp(wide.h,0.22,k),ty:lerp(wide.ty,0.40,k),tx:lerp(wide.tx,0.0,k)};}
    if(replay){const k=t-R.replayT0;cam={ang:0.62+0.03*k,dist:0.95-0.015*k,h:0.04,ty:0.40,tx:0.03};}
    if(R.rw&&t>=R.replayT1){const k=sm(R.replayT1,R.replayT1+1.0,t),st=r.target==='steel';cam={ang:lerp(0.6,0.30,k),dist:lerp(0.95,st?0.7:0.9,k),h:lerp(0.04,st?0.55:0.35,k),ty:lerp(0.40,st?0.40:0.36,k),tx:0.0};}
    if(r.kind==='scratch'&&t>=R.actEnd){cam={ang:0.12,dist:0.55,h:0.30,ty:0.40,tx:0.0};}
  } else {const k=t-T.explain[0];cam={ang:0.30+0.25*Math.sin(k*0.25),dist:0.9,h:0.35,ty:0.36,tx:0.0};}
  Object.assign(s,{camAng:cam.ang,camDist:cam.dist,camH:cam.h,camTY:cam.ty,camTX:cam.tx||0});
  return s;
}

// ---------------------------------------------------------------- WebGL
const gl=document.getElementById('gl').getContext('webgl',{preserveDrawingBuffer:true,antialias:false});
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
const prog=gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,document.getElementById('fs').textContent));
gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));gl.useProgram(prog);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
let LOGO=null;
const al=gl.getAttribLocation(prog,'a');gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
const U={};['R','camAng','camDist','camH','camTY','camTX','shake','showCube','dent','scratchX','scratchOn','showGem','gemFlip','gemP','showHolder','showHammer','phi','pivot','pM','pP','split','dust','crack'].forEach(n=>U[n]=gl.getUniformLocation(prog,n));

function project(s,p){
  const ta=[s.camTX||0,s.camTY,0], ro=[ta[0]+Math.sin(s.camAng)*s.camDist,ta[1]+s.camH,ta[2]+Math.cos(s.camAng)*s.camDist];
  const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
  const nrm=a=>{const l=Math.hypot(...a);return a.map(v=>v/l);},cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
  const ww=nrm(sub(ta,ro)),uu=nrm(cross(ww,[0,1,0])),vv=cross(uu,ww),d=sub(p,ro);
  const z=dot(d,ww),ux=dot(d,uu)/z*2.35,uy=dot(d,vv)/z*2.35;
  return [(ux*1920+1080)/2,(1920-(uy*1920+1920)/2),z];
}

// ---------------------------------------------------------------- overlay
const out=document.getElementById('out'),c=out.getContext('2d');const W=1080,H=1920;
const COL={green:'#1F9D55',red:'#E0303F',ink:'#1d2126',sub:'#5b636c',brand:'#F7C21A',blue:'#2E3FA8'};
const fade=(t0,t,d=0.25)=>clamp((t-t0)/d,0,1);
const pop=(t0,t)=>{const k=clamp((t-t0)/0.25,0,1);return 1+0.18*Math.sin(k*Math.PI)*(1-k);};
function rrect(x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function panel(x,y,w,h,r,fill,a=1){if(a<=0)return;c.save();c.globalAlpha=a;c.fillStyle=fill;rrect(x,y,w,h,r);c.fill();c.restore();}
function fitText(s,maxW,size){c.font=`700 ${size}px P, DJ`;while(c.measureText(s).width>maxW&&size>18){size-=2;c.font=`700 ${size}px P, DJ`;}return size;}
function ctxt(s,x,y,size,color,a=1){if(a<=0)return;c.save();c.globalAlpha=a;c.font=`700 ${size}px P, DJ`;c.textAlign='center';c.textBaseline='middle';
  c.lineJoin='round';c.lineWidth=size*0.16;c.strokeStyle='rgba(255,255,255,0.85)';c.strokeText(s,x,y);
  c.shadowColor='rgba(0,0,0,0.18)';c.shadowBlur=size*0.12;c.shadowOffsetY=size*0.04;c.fillStyle=color;c.fillText(s,x,y);c.restore();}
function pill(s,x,y,size,fill,a=1){if(a<=0)return;const fs=size;c.font=`700 ${fs}px P, DJ`;const w=c.measureText(s).width+fs*1.1;
  panel(x-w/2,y-fs*0.85,w,fs*1.7,fs*0.85,fill,a);c.save();c.globalAlpha=a;c.font=`700 ${fs}px P, DJ`;c.textAlign='center';c.textBaseline='middle';c.fillStyle='#fff';c.fillText(s,x,y+1);c.restore();}

function labels(s,a){
  if(a<=0) return;const r=s.R.cfg, n=CFG.names||{};
  if(s.showGem){const q=project(s,[s.gemP[0],s.gemP[1]+(s.gemFlip?0.07:0.06),0]);pill(n.gem||'DIAMOND',q[0]-150,q[1],28,COL.blue,a);}
  if(s.showCube){const q=project(s,[0,BT+CUBE,0.07]);pill(n.steel||'STEEL',q[0]+150,q[1],28,'#5b636c',a);}
  if(s.showHammer){const q=project(s,[s.pivot[0]-0.42,s.pivot[1]+Math.sin(s.phi)*0.42+0.12,0]);pill(n.hammer||'HAMMER',q[0]+60,q[1],28,'#9a5a22',a);}
}
function overlay(cfg,T,t,s){
  const R=s.R, r=R.cfg;
  { const gr=c.createLinearGradient(0,0,0,690);gr.addColorStop(0,'rgba(236,240,243,0.92)');gr.addColorStop(0.78,'rgba(236,240,243,0.80)');gr.addColorStop(1,'rgba(236,240,243,0)');
    c.save();c.fillStyle=gr;c.fillRect(0,0,W,690);c.restore(); }
  if(t>=T.hook[1]||cfg.hook_series!==false) ctxt(cfg.series,W/2,292,34,COL.sub,0.9);
  drawHandle(c,cfg);
  if(t<T.hook[1]){const a=1-fade(T.hook[1]-0.3,t,0.3),hn=cfg.hook.length;
    cfg.hook.forEach((l,i)=>ctxt(l,W/2,390+i*90,fitText(l,960,82),hn>1&&i===hn-1?COL.red:COL.ink,a));return;}
  if(t<T.hook[1]+0.18){c.save();c.globalAlpha=1-fade(T.hook[1],t,0.18);c.fillStyle='#fff';c.fillRect(0,0,W,H);c.restore();}
  if(t<T.explain[0]){
    const stampOn=t>=R.stampT;
    if(t<R.titleEnd+0.2){const a=1-fade(R.titleEnd-0.1,t,0.3),p=pop(R.start,t);c.save();c.translate(W/2,430);c.scale(p,p);ctxt(r.title,0,0,fitText(r.title,960,76),COL.ink,a);c.restore();}
    else if(t<R.qStart){ if(r.subtitle) ctxt(r.subtitle,W/2,430,fitText(r.subtitle,960,52),COL.ink,fade(R.titleEnd,t)); }
    else if(t<R.go){const a=fade(R.qStart,t)*(1-fade(R.go-0.15,t,0.15)),p=1+0.05*Math.sin((t-R.qStart)*Math.PI*4);
      c.save();c.translate(W/2,415);c.scale(p,p);ctxt(r.question,0,0,fitText(r.question,960,96),COL.red,a);c.restore();
      ctxt(r.question_sub,W/2,515,fitText(r.question_sub,900,40),COL.ink,a);
      const n=Math.ceil(R.qEnd-t);if(n>=1&&n<=3&&t>R.qEnd-3) ctxt(String(n),W/2,590,56,COL.ink,a);}
    else if(!stampOn&&!s.replay&&r.action_text) ctxt(r.action_text,W/2,430,fitText(r.action_text,960,80),COL.ink,fade(R.go,t,0.15));
    if(t>=R.titleEnd&&t<R.go) labels(s,fade(R.titleEnd,t)*(1-fade(R.go-0.2,t,0.2)));
    if(s.replay){const a=fade(R.replayT0,t,0.15)*(1-fade(R.replayT1-0.15,t,0.15));
      c.save();c.globalAlpha=a*0.9;c.fillStyle='#000';c.fillRect(0,640,W,16);c.fillRect(0,1424,W,16);c.restore();
      pill((cfg.replay_label||'SLOW-MO')+' ×'+Math.round(1/SLOW),W/2,700,28,'rgba(224,48,63,0.92)',a);}
    if(stampOn){
      const k=clamp((t-R.stampT)/0.18,0,1),sc2=lerp(2.2,1,k*k)+(k>=1?0.05*Math.exp(-(t-R.stampT-0.18)*10)*Math.sin((t-R.stampT-0.18)*40):0);
      const col=r.stamp.color==='green'?COL.green:COL.red;
      c.save();c.translate(W/2,425);c.rotate(-0.08);c.scale(sc2,sc2);c.globalAlpha=Math.min(1,k*1.5);
      c.strokeStyle=col;c.lineWidth=10;rrect(-300,-72,600,144,22);c.stroke();c.fillStyle='rgba(255,255,255,0.7)';rrect(-300,-72,600,144,22);c.fill();
      const fs=fitText(r.stamp.text,540,84);c.font=`700 ${fs}px P, DJ`;c.textAlign='center';c.textBaseline='middle';c.fillStyle=col;c.fillText(r.stamp.text,0,5);c.restore();}
    if(t>=R.factT){const a=fade(R.factT,t,0.3)*(1-fade(R.end-0.25,t));(r.fact||[]).forEach((l,i)=>ctxt(l,W/2,555+i*50,fitText(l,980,38),COL.ink,a));}
    if(t<R.start+0.3){c.save();c.globalAlpha=1-fade(R.start,t,0.3);c.fillStyle='#fff';c.fillRect(0,0,W,H);c.restore();}
    return;}
  if(t<T.explain[0]+0.3){c.save();c.globalAlpha=1-fade(T.explain[0],t,0.3);c.fillStyle='#fff';c.fillRect(0,0,W,H);c.restore();}
  if(t<T.outro[0]){const e=cfg.explain,t0=T.explain[0];
    ctxt(e.title,W/2,370,fitText(e.title,960,64),COL.ink,fade(t0,t));
    e.lines.forEach((l,i)=>ctxt(l,W/2,450+i*54,fitText(l,960,40),i===e.lines.length-1?COL.green:COL.sub,fade(t0+0.8+i*2.0,t,0.3)));return;}
  const t0=T.outro[0];
  // end screen: the source, then the NEXT TEST (an open loop: the next episode, reserved in the Sheet)
  const nx=cfg.next_test, sw=nx?Math.min(2.6,(T.outro[1]-T.outro[0])*0.4):1e9, sa=fade(t0,t)*(1-fade(t0+sw,t,0.25));
  ctxt('SOURCE',W/2,345,28,COL.sub,sa);
  cfg.source.forEach((l,i)=>ctxt(l,W/2,395+i*48,fitText(l,980,32),COL.ink,sa));
  if(nx&&t>=t0+sw){const na=fade(t0+sw+0.1,t,0.25);ctxt(cfg.next_label||'NEXT TEST',W/2,345,30,COL.sub,na);ctxt(nx,W/2,425,fitText(nx,960,62),COL.red,na);}
  if(t>=t0+1.4){const a=fade(t0+1.4,t,0.25),p=pop(t0+1.4,t);
    c.save();c.translate(W/2,560);c.scale(p,p);panel(-380,-50,760,100,50,COL.brand,a);
    c.font=`700 ${fitText(cfg.cta,700,42)}px P, DJ`;c.textAlign='center';c.textBaseline='middle';c.globalAlpha=a;c.fillStyle=COL.ink;c.fillText(cfg.cta,0,2);c.restore();}
}

// ---------------------------------------------------------------- API used by render.js
let CFG=null,TL=null;
window.setup=function(cfg){if(!LOGO){LOGO=makeLogoTexture();gl.uniform1i(gl.getUniformLocation(prog,'logo'),0);}CFG=cfg;TL=buildTimeline(cfg);
  return {duration:TL.duration,events:TL.events,rounds:TL.rounds.map(R=>({title:R.cfg.title}))};};
function sceneTime(t){                                  // hook: the diamond round's slow motion, cut just before the hammer lands
  if(t<TL.hook[1]){const R=TL.rounds[TL.rounds.length-1];const rt=R.rw[0]-0.08+(t/TL.hook[1])*(TS-0.006-(R.rw[0]-0.08));return R.replayT0+(rt-R.rw[0])/SLOW;}
  return t;
}
window.renderFrame=function(t,type='image/jpeg'){drawFrame(t);return out.toDataURL(type,0.93);};
function drawFrame(t){
  const s=sceneState(TL,sceneTime(t));
  gl.viewport(0,0,1080,1920);gl.uniform2f(U.R,1080,1920);
  gl.uniform1f(U.camAng,s.camAng);gl.uniform1f(U.camDist,s.camDist);gl.uniform1f(U.camH,s.camH);gl.uniform1f(U.camTY,s.camTY);gl.uniform1f(U.camTX,s.camTX);
  gl.uniform2f(U.shake,s.shake[0],s.shake[1]);
  gl.uniform1f(U.showCube,s.showCube);gl.uniform1f(U.dent,s.dent);gl.uniform1f(U.scratchX,s.scratchX);gl.uniform1f(U.scratchOn,s.scratchOn);
  gl.uniform1f(U.showGem,s.showGem);gl.uniform1f(U.gemFlip,s.gemFlip);gl.uniform3f(U.gemP,...s.gemP);gl.uniform1f(U.showHolder,s.showHolder);
  gl.uniform1f(U.showHammer,s.showHammer);gl.uniform1f(U.phi,s.phi);gl.uniform3f(U.pivot,...s.pivot);
  gl.uniform1f(U.split,s.split);gl.uniform1f(U.crack,s.crack);
  const PM=new Float32Array(72),PP=new Float32Array(24);
  for(let i=0;i<8;i++){const pc=s.pieces?s.pieces[i]:{P:s.gemP,M:[1,0,0,0,1,0,0,0,1]};PM.set(pc.M,i*9);PP.set(pc.P,i*3);}
  gl.uniformMatrix3fv(U.pM,false,PM);gl.uniform3fv(U.pP,PP);
  const DU=new Float32Array(24);s.dust.forEach((d,i)=>DU.set(d,i*4));gl.uniform4fv(U.dust,DU);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,LOGO);
  gl.drawArrays(gl.TRIANGLES,0,3);gl.finish();
  c.imageSmoothingQuality='high';c.drawImage(document.getElementById('gl'),0,0,W,H);
  if(!window.CLEAN)overlay(CFG,TL,t,s);   // CLEAN: scene only (cover image)
}
window.ready=Promise.all([document.fonts.load('700 40px P'),document.fonts.load('700 40px DJ')]).then(()=>true);
