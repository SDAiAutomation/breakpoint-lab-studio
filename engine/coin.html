<!doctype html>
<html><head><meta charset="utf-8">
<!-- Coin engine (Breakpoint Lab, episode 017): a penny dropped from the top of the Empire State Building, can it hurt
     someone? The scene is rendered in Blender (Cycles, tools/blender/coin_scene.py); this page simulates the fall, lays
     out the video (timeline), says which scene pose each frame shows, and draws the texts and the live speed readout.
     Physics: round "vacuum": free fall, v = sqrt(2 g h), 208 mph at the street (L. Bloomfield, Univ. of Virginia).
     Round "air": quadratic drag, v(t) = vt tanh(g t / vt), terminal speed vt = 25 mph reached after about 50 ft
     (Bloomfield, wind tunnel). MythBusters "Penny Drop" (2003): busted, a penny cannot break the skin.
     The long fall is shown fast-forwarded (labelled "FAST-FORWARD ×k"); the readout always shows the true speed. -->
<style>
@font-face{font-family:P;src:url("fonts/Poppins-Bold.ttf");font-weight:700}
@font-face{font-family:DJ;src:url("fonts/DejaVuSans-Bold.ttf");font-weight:700}
html,body{margin:0;background:#000}canvas{display:block}
</style></head>
<body>
<canvas id="out" width="1080" height="1920"></canvas>
<script>
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const sm=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const lerp=(a,b,t)=>a+(b-a)*t;
const FPS=30;
const out=document.getElementById('out'),c=out.getContext('2d');const W=1080,H=1920;
const COL={green:'#1F9D55',red:'#E0303F',ink:'#1d2126',sub:'#5b636c',brand:'#F7C21A',blue:'#2F6FE0'};

// ---------------------------------------------------------------- physics (SI, z up; the coin's centre touches the forehead at Z_HIT)
const G=9.81, MPH=1/0.44704;
const Z_HIT=1.609;                                     // forehead top of the headform (tools/blender/headform.py, coin_scene.py)
const V_VAC=208*0.44704, H_DROP=V_VAC*V_VAC/(2*G);     // 208 mph at the street (Bloomfield) -> drop height 440.7 m
const VT=25*0.44704;                                   // terminal speed of a tumbling penny: 25 mph (Bloomfield)
function simulate(r){
  const air=r.kind==='air', h=H_DROP;
  const tf=air?(()=>{let lo=0,hi=200;for(let k=0;k<80;k++){const m=(lo+hi)/2;(VT*VT/G)*Math.log(Math.cosh(G*m/VT))<h?lo=m:hi=m;}return lo;})()
              :Math.sqrt(2*h/G);
  const fallen=u=>air?(VT*VT/G)*Math.log(Math.cosh(G*Math.min(u,tf)/VT)):0.5*G*Math.min(u,tf)**2;
  const vel=u=>u<=0?0:air?VT*Math.tanh(G*Math.min(u,tf)/VT):G*Math.min(u,tf);
  const vImp=vel(tf), e=air?0.30:0.25, vb=e*vImp;    // rebound off the vinyl forehead
  return {air,h,tf,vImp,mph:Math.round(vImp*MPH),
    A:air?2.1:0.5, B:0.6, K:air?15:3,                  // real time for the first A s and the last B s, fast-forward xK between
    coin(u){                                           // coin centre (x, z), tilt (deg, 0 = flat), yaw (deg)
      if(u<=0) return {x:0,z:Z_HIT+h,tilt:air?8:35,yaw:0};
      if(u<tf){const z=Z_HIT+h-fallen(u);
        if(!air) return {x:0,z,tilt:35,yaw:40*u};
        const k=1-Math.exp(-(tf-u)*6);                 // the flutter dies out over the last fraction of a second: it hits the forehead
        return {x:0.035*Math.sin(u*7.3)*k*sm(0,1,u),z,tilt:8+46*Math.abs(Math.sin(u*9.4))*sm(0,0.6,u),yaw:90*u};}
      const v=u-tf;                                    // bounce: up and away, flipping
      return {x:0.25*vb*v,z:Z_HIT+vb*v-0.5*G*v*v,tilt:(air?20:35)+2400*v*(air?0.5:1),yaw:40*tf+300*v};},
    vel};
}

// ---------------------------------------------------------------- timeline
const D_={hook:2.4,hookPlay:2.1,title:1.3,setup:0.4,question:1.9,qFirst:1.6,keyGap:0.35,after:1.0,rpGap:0.25,
          stampGap:0.3,stampHold:0.9,fact:4.0,explainLead:0.8,line:3.2,explainTail:2.6,outro:7.5};
const RP={vacuum:{slow:0.01,a:0.024,b:0.012},air:{slow:0.05,a:0.075,b:0.085}};   // slow motion (high-speed camera) around the hit
const HOOK_FREEZE=0.0015;                              // the hook stops this long (scene time) before the contact
function fallVideo(S){return S.A+(S.tf-S.B-S.A)/S.K+S.B;}
function sceneU(S,w){                                  // video time since the drop -> scene time (fast-forward in the middle)
  if(w<=S.A) return w;
  const ff=(S.tf-S.B-S.A)/S.K;
  if(w<=S.A+ff) return S.A+(w-S.A)*S.K;
  return S.tf-S.B+(w-S.A-ff);
}
function buildTimeline(cfg){
  const T={rounds:[],events:[]},ev=e=>T.events.push(e);
  let t=D_.hook;T.hook=[0,D_.hook];
  cfg.rounds.forEach((r,i)=>{
    const S=simulate(r),rp=RP[S.air?'air':'vacuum'];
    const R={cfg:r,i,S,rp};
    R.start=t;ev({type:'round',t});
    R.titleEnd=t+D_.title;R.qStart=R.titleEnd+D_.setup;R.qEnd=R.qStart+(i===0?D_.qFirst:D_.question);
    ev({type:'question',t0:R.qStart,t1:R.qEnd});
    R.dropT=R.qEnd+D_.keyGap;ev({type:'drop',t:R.dropT,gain:0.6});
    R.ffT0=R.dropT+S.A;R.ffT1=R.ffT0+(S.tf-S.B-S.A)/S.K;
    R.hitT=R.dropT+fallVideo(S);ev({type:'impact',t:R.hitT,gain:S.air?0.45:1});
    R.afterEnd=R.hitT+0.45+D_.after;
    R.rpA=S.tf-rp.a;R.rpB=S.tf+rp.b;
    R.replayT0=R.afterEnd+D_.rpGap;R.replayT1=R.replayT0+(R.rpB-R.rpA)/rp.slow;
    ev({type:'replay',t0:R.replayT0,t1:R.replayT1});
    ev({type:'impact',t:R.replayT0+(S.tf-R.rpA)/rp.slow,gain:S.air?0.4:0.8,speed:S.air?0.25:0.2});
    R.stampT=R.replayT1+D_.stampGap;ev({type:'stamp',t:R.stampT,color:r.stamp.color});
    R.factT=R.stampT+D_.stampHold;ev({type:'card',t:R.factT});
    R.end=R.factT+D_.fact;t=R.end;
    T.rounds.push(R);
  });
  const nl=(cfg.explain.lines||[]).length, ex=D_.explainLead+nl*D_.line+D_.explainTail;
  T.explain=[t,t+ex];ev({type:'explain',t0:t,t1:t+ex});t+=ex;
  T.outro=[t,t+D_.outro];ev({type:'card',t});ev({type:'cta',t:t+1.4});t+=D_.outro;
  T.duration=t;
  T.events.sort((a,b)=>(a.t??a.t0)-(b.t??b.t0));
  return T;
}
const hookRound=(T,cfg)=>T.rounds[clamp((cfg.hook_round||1)-1,0,T.rounds.length-1)];

// ---------------------------------------------------------------- scene pose (what Blender renders for this frame)
const q=(x,s)=>Math.round(x/s)*s;
const HIT_HOLD=0.6;                                    // after the hit the bounce runs 0.6 s (scene), then that image is held
const WIDE={cz:1.45,d:5.0,wide:1};                     // street shot: the bust on the BREAKPOINT LAB base, the tower behind
function pose(R,u,du=1/FPS){                           // u = time since the drop (negative: waiting); du = scene time per video frame
  const S=R.S;
  const uu=u>=S.tf?Math.min(u,S.tf+HIT_HOLD):u;
  const k=S.coin(uu), live=u>0&&u<S.tf;
  const mb=live?Math.min(3.0,S.vel(u)*du*(du<1/FPS?0.35:1)):0;   // coin drop during one video frame (speed blur); capped
  const hit=u>=S.tf?Math.min(u-S.tf,HIT_HOLD):-1;
  const cz=u<S.tf?Math.max(k.z,Z_HIT):Z_HIT;           // the camera rides with the coin, then waits at the forehead
  return {zc:k.z,cx:k.x,tilt:k.tilt,yaw:k.yaw,cz,d:0.6,wide:0,mb,hit,v:S.vel(u),live,air:S.air};
}
function wideP(R){const k=R.S.coin(0);return {zc:k.z,cx:0,tilt:k.tilt,yaw:0,cz:WIDE.cz,d:WIDE.d,wide:1,mb:0,hit:-1,v:0,live:false,air:R.S.air};}
const slowU=(R,k)=>{const st=R.rp.slow/FPS;return R.rpA+Math.min(Math.max(0,Math.round(k)),Math.round((R.rpB-R.rpA)/st))*st;};
function poseAt(T,t){
  const HR=hookRound(T,CFG);
  if(t<T.hook[1]){                                     // hook: the slow motion from frame 0, frozen just before the contact
    const st=HR.rp.slow/FPS, kEnd=Math.round((HR.S.tf-HOOK_FREEZE-HR.rpA)/st), k0=kEnd-Math.round(D_.hookPlay*FPS);
    return pose(HR,slowU(HR,k0+Math.min(t,D_.hookPlay)*FPS),st);}
  if(t>=T.explain[0]){                                 // WHY: the hook round replays in slow motion behind the text (loops)
    if(t>=T.outro[0]) return wideP(HR);
    const st=HR.rp.slow/FPS, n=Math.round((HR.rpB-HR.rpA)/st), k=Math.round((t-T.explain[0])*FPS)%(n+45);
    return pose(HR,slowU(HR,k),st);}
  let R=T.rounds[0];for(const r of T.rounds) if(t>=r.start) R=r;
  if(t<R.dropT) return wideP(R);                       // title, question: the street, the dummy looking up
  if(t>=R.replayT0&&t<R.replayT1) return pose(R,slowU(R,(t-R.replayT0)*FPS),R.rp.slow/FPS);
  if(t>=R.replayT1) return pose(R,R.S.tf+HIT_HOLD);
  const w=t-R.dropT, u=sceneU(R.S,w), ff=w>R.S.A&&w<R.S.A+(R.S.tf-R.S.B-R.S.A)/R.S.K;
  return pose(R,u,ff?R.S.K/FPS:1/FPS);
}
function poseKey(p){
  const f=(x,s,n)=>q(x,s).toFixed(n);
  if(p.wide) return `w_${p.air?'a':'v'}`;
  const zs=p.zc-Z_HIT<1?0.001:p.zc-Z_HIT<20?0.01:0.05;   // fine steps near the head, coarse high up (the tower looks the same)
  return `z${f(p.zc,zs,3)}_x${f(p.cx,0.002,3)}_t${f(p.tilt,2,0)}_y${f(p.yaw,5,0)}_k${f(p.cz,zs,3)}_i${f(p.hit,0.002,3)}_m${f(p.mb,0.02,2)}`;
}
function keyPose(p){
  if(p.wide) return {zc:p.zc,cx:0,tilt:p.tilt,yaw:0,cz:p.cz,d:p.d,wide:1,mb:0,hit:-1};
  const zs=p.zc-Z_HIT<1?0.001:p.zc-Z_HIT<20?0.01:0.05;
  return {zc:q(p.zc,zs),cx:q(p.cx,0.002),tilt:q(p.tilt,2),yaw:q(p.yaw,5),cz:q(p.cz,zs),d:p.d,wide:0,hit:q(p.hit,0.002),mb:q(p.mb,0.02)};
}

// ---------------------------------------------------------------- drawing helpers (same look as the other engines)
let DEC='.';
const fade=(t0,t,d=0.25)=>clamp((t-t0)/d,0,1);
const pop=(t0,t)=>{const k=clamp((t-t0)/0.25,0,1);return 1+0.18*Math.sin(k*Math.PI)*(1-k);};
function rrect(x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function panel(x,y,w,h,r,fill,a=1){if(a<=0)return;c.save();c.globalAlpha=a;c.fillStyle=fill;rrect(x,y,w,h,r);c.fill();c.restore();}
function fitText(s,maxW,size){c.font=`700 ${size}px P, DJ`;while(c.measureText(s).width>maxW&&size>18){size-=2;c.font=`700 ${size}px P, DJ`;}return size;}
function ctxt(s,x,y,size,color,a=1){if(a<=0)return;c.save();c.globalAlpha=a;c.font=`700 ${size}px P, DJ`;c.textAlign='center';c.textBaseline='middle';
  c.lineJoin='round';c.lineWidth=size*0.16;c.strokeStyle='rgba(255,255,255,0.85)';c.strokeText(s,x,y);
  c.shadowColor='rgba(0,0,0,0.18)';c.shadowBlur=size*0.12;c.shadowOffsetY=size*0.04;c.fillStyle=color;c.fillText(s,x,y);c.restore();}
function pill(s,x,y,size,fill,a=1){if(a<=0)return;const fs=size;c.font=`700 ${fs}px P, DJ`;const w=c.measureText(s).width+fs*1.1;
  panel(x-w/2,y-fs*0.85,w,fs*1.7,fs*0.85,fill,a);c.save();c.globalAlpha=a;c.font=`700 ${fs}px P, DJ`;c.textAlign='center';c.textBaseline='middle';c.fillStyle='#fff';c.fillText(s,x,y+1);c.restore();}
function drawHandle(cfg){
  if(!cfg.handle) return;
  c.save(); c.font='700 24px P, DJ'; c.textBaseline='middle'; c.textAlign='left';
  const tw=c.measureText(cfg.handle).width, gap=12, dot=7, y=256, x=W/2-(tw+gap+2*dot)/2;
  c.fillStyle='#f5c400'; c.beginPath(); c.arc(x+dot,y,dot,0,Math.PI*2); c.fill();
  c.lineWidth=2; c.strokeStyle='rgba(22,24,29,0.85)'; c.stroke();
  c.globalAlpha=0.8; c.fillStyle='#2a2e36'; c.fillText(cfg.handle,x+2*dot+gap,y+1); c.restore();
}
// live instrument: the coin's true speed (simulated), held at the impact value
function speedo(x,y,p,a){
  if(a<=0) return;
  const hit=p.hit>=0;
  panel(x-130,y-59,260,144,26,'rgba(255,255,255,0.82)',a);
  c.save();c.globalAlpha=a;c.textAlign='center';c.textBaseline='middle';
  c.font='700 24px P, DJ';c.fillStyle=COL.sub;c.fillText(hit?'IMPACT':'SPEED',x,y-27);
  c.font='700 60px P, DJ';c.fillStyle=hit?COL.red:COL.ink;c.fillText(String(Math.round(p.v*MPH)),x-24,y+28);
  c.font='700 24px P, DJ';c.fillStyle=COL.sub;c.fillText('mph',x+74,y+38);
  c.restore();
}
function overlay(cfg,T,t,p){
  if(t>=T.hook[1]||cfg.hook_series!==false) ctxt(cfg.series,W/2,292,34,COL.sub,0.9);
  drawHandle(cfg);
  if(t<T.hook[1]){const a=1-fade(T.hook[1]-0.3,t,0.3),hn=cfg.hook.length;
    pill(cfg.replay_label||'SLOW-MO',W/2,640,28,'rgba(224,48,63,0.92)',a);
    cfg.hook.forEach((l,i)=>ctxt(l,W/2,400+i*95,fitText(l,960,84),hn>1&&i===hn-1?COL.red:COL.ink,a));return;}
  if(t<T.hook[1]+0.18){c.save();c.globalAlpha=1-fade(T.hook[1],t,0.18);c.fillStyle='#fff';c.fillRect(0,0,W,H);c.restore();}
  if(t<T.explain[0]){
    let R=T.rounds[0];for(const r of T.rounds) if(t>=r.start) R=r;const r=R.cfg, stampOn=t>=R.stampT;
    const inRp=t>=R.replayT0&&t<R.replayT1;
    if(t<R.titleEnd+0.2){const a=1-fade(R.titleEnd-0.1,t,0.3),pp=pop(R.start,t);c.save();c.translate(W/2,430);c.scale(pp,pp);ctxt(r.title,0,0,fitText(r.title,960,72),COL.ink,a);c.restore();}
    else if(t<R.qStart) {}
    else if(t<R.dropT-0.1){const a=fade(R.qStart,t)*(1-fade(R.dropT-0.2,t,0.1)),pp=1+0.05*Math.sin((t-R.qStart)*Math.PI*4);
      c.save();c.translate(W/2,415);c.scale(pp,pp);ctxt(r.question,0,0,fitText(r.question,960,92),COL.red,a);c.restore();
      ctxt(r.question_sub,W/2,515,fitText(r.question_sub,900,40),COL.ink,a);}   // gone before the drop: one thing at a time
    const meterA=t>=R.titleEnd&&t<R.dropT?fade(R.titleEnd,t)*(1-fade(R.dropT-0.2,t,0.2)):0;
    if(meterA>0) pill(r.meter,W/2,628,30,R.S.air?'rgba(47,111,224,0.92)':'rgba(91,99,108,0.92)',meterA);
    const ffA=t>=R.ffT0&&t<R.ffT1?fade(R.ffT0,t,0.15)*(1-fade(R.ffT1-0.15,t,0.15)):0;
    if(ffA>0) pill(`FAST-FORWARD ×${R.S.K}`,W/2,628,28,'rgba(91,99,108,0.92)',ffA);
    if(!stampOn&&t>=R.dropT-0.3) speedo(175,770,p,fade(R.dropT-0.3,t,0.25)*(1-fade(R.stampT-0.2,t,0.2)));
    if(inRp){const a=fade(R.replayT0,t,0.15)*(1-fade(R.replayT1-0.15,t,0.15));
      pill((cfg.replay_label||'SLOW-MO'),W/2,628,28,'rgba(224,48,63,0.92)',a);}
    if(stampOn){
      const k=clamp((t-R.stampT)/0.18,0,1),sc2=lerp(2.2,1,k*k)+(k>=1?0.05*Math.exp(-(t-R.stampT-0.18)*10)*Math.sin((t-R.stampT-0.18)*40):0);
      const col=r.stamp.color==='green'?COL.green:COL.red;
      c.save();c.translate(W/2,425);c.rotate(-0.08);c.scale(sc2,sc2);c.globalAlpha=Math.min(1,k*1.5);
      c.strokeStyle=col;c.lineWidth=10;rrect(-330,-72,660,144,22);c.stroke();c.fillStyle='rgba(255,255,255,0.7)';rrect(-330,-72,660,144,22);c.fill();
      const fs=fitText(r.stamp.text,600,84);c.font=`700 ${fs}px P, DJ`;c.textAlign='center';c.textBaseline='middle';c.fillStyle=col;c.fillText(r.stamp.text,0,5);c.restore();}
    if(t>=R.factT){const a=fade(R.factT,t,0.3)*(1-fade(R.end-0.25,t));(r.fact||[]).forEach((l,i)=>ctxt(l,W/2,555+i*50,fitText(l,980,38),COL.ink,a));}
    if(t<R.start+0.3){c.save();c.globalAlpha=1-fade(R.start,t,0.3);c.fillStyle='#fff';c.fillRect(0,0,W,H);c.restore();}
    return;}
  if(t<T.explain[0]+0.3){c.save();c.globalAlpha=1-fade(T.explain[0],t,0.3);c.fillStyle='#fff';c.fillRect(0,0,W,H);c.restore();}
  if(t<T.outro[0]){const e=cfg.explain,t0=T.explain[0],n=e.lines.length;
    ctxt(e.title,W/2,350,fitText(e.title,960,60),COL.ink,fade(t0,t));
    e.lines.forEach((l,i)=>ctxt(l,W/2,430+i*62,fitText(l,960,46),i===n-1?COL.red:COL.sub,fade(t0+D_.explainLead+i*D_.line,t,0.3)));
    speedo(175,770,p,fade(t0+D_.explainLead,t,0.4));
    return;}
  const t0=T.outro[0];
  const nx=cfg.next_test, sw=nx?Math.min(2.6,(T.outro[1]-T.outro[0])*0.4):1e9, sa=fade(t0,t)*(1-fade(t0+sw,t,0.25));
  ctxt('SOURCE',W/2,345,28,COL.sub,sa);
  cfg.source.forEach((l,i)=>ctxt(l,W/2,395+i*48,fitText(l,980,32),COL.ink,sa));
  if(nx&&t>=t0+sw){const na=fade(t0+sw+0.1,t,0.25);ctxt(cfg.next_label||'NEXT TEST',W/2,345,30,COL.sub,na);ctxt(nx,W/2,425,fitText(nx,960,62),COL.red,na);}
  if(t>=t0+1.4){const a=fade(t0+1.4,t,0.25),pp=pop(t0+1.4,t);
    c.save();c.translate(W/2,560);c.scale(pp,pp);panel(-380,-50,760,100,50,COL.brand,a);
    c.font=`700 ${fitText(cfg.cta,700,42)}px P, DJ`;c.textAlign='center';c.textBaseline='middle';c.globalAlpha=a;c.fillStyle=COL.ink;c.fillText(cfg.cta,0,2);c.restore();}
}

// ---------------------------------------------------------------- scene images
const IMG={};
function loadImg(src){return new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src=src;});}
async function sceneImage(key){
  if(!(key in IMG)) IMG[key]=await loadImg((CFG.scene_dir||'../work/bscene')+'/'+key+'.jpg');
  return IMG[key];
}
function placeholder(key,p){window.PLACEHOLDER=true;                              // before the Blender render: a rough front view, so overlays can be checked
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#c9d4df');g.addColorStop(1,'#8d949c');c.fillStyle=g;c.fillRect(0,0,W,H);
  const s=1920/(0.4235*p.d), X=x=>W/2+x*s, Y=z=>H/2-(z-p.cz)*s;
  c.save();c.fillStyle='#bfc3c8';c.fillRect(X(-0.45),Y(1.10),0.9*s,1.10*s);
  c.fillStyle='#e9c46a';c.beginPath();c.ellipse(X(0),Y(1.55),0.118*s,0.128*s,0,0,Math.PI*2);c.fill();
  c.fillStyle='#b5651d';c.beginPath();c.ellipse(X(p.cx),Y(p.zc),0.0095*s,Math.abs(0.0095*s*Math.cos(p.tilt*Math.PI/180))+1,0,0,Math.PI*2);c.fill();
  c.restore();c.save();c.font='700 22px P, DJ';c.textAlign='center';c.fillStyle='#1d2126';c.fillText(key,W/2,1500);c.restore();
}

// ---------------------------------------------------------------- API used by render.js
let CFG=null,TL=null;
window.setup=function(cfg){CFG=cfg;DEC=cfg.decimal||'.';TL=buildTimeline(cfg);
  const seen=new Map();const N=Math.round(TL.duration*FPS);
  for(let i=0;i<N;i++){const p=poseAt(TL,i/FPS),k=poseKey(p);if(!seen.has(k)) seen.set(k,{key:k,...keyPose(p)});}
  return {duration:TL.duration,events:TL.events,poses:[...seen.values()],
          rounds:TL.rounds.map(R=>({title:R.cfg.title,kind:R.cfg.kind,h:+R.S.h.toFixed(1),tf:+R.S.tf.toFixed(3),mph:R.S.mph,
            fall_video:+fallVideo(R.S).toFixed(2),ff:R.S.K,drop:R.dropT,hit:R.hitT}))};};
window.poseKeyAt=t=>poseKey(poseAt(TL,t));
async function drawFrame(t){
  const p=poseAt(TL,t),key=poseKey(p),im=await sceneImage(key);
  let z=1;                                                // slow push-in on held images: the picture never freezes
  if(t>=TL.outro[0]) z=1+0.06*sm(TL.outro[0],TL.duration,t);
  else for(const R of TL.rounds) if(t>=R.stampT&&t<R.end) z=1+0.05*sm(R.stampT,R.end,t);
  else if(t>=R.start&&t<R.dropT) z=1+0.05*sm(R.start,R.dropT,t);
  let sy=0;for(const R of TL.rounds){const u=t-R.hitT;if(u>=0&&u<0.3) sy=(R.S.air?5:14)*Math.exp(-u*12)*Math.sin(u*70);}
  if(im){c.imageSmoothingQuality='high';const zw=W*z,zh=H*z;c.drawImage(im,(W-zw)/2,(H-zh)*0.5+sy,zw,zh);} else placeholder(key,p);
  if(!window.CLEAN) overlay(CFG,TL,t,p);
}
window.renderFrame=async function(t,type='image/jpeg'){
  const L=0.45;
  if(t>TL.duration-L){
    await drawFrame(0);const first=document.createElement('canvas');first.width=W;first.height=H;first.getContext('2d').drawImage(out,0,0);
    await drawFrame(t);c.save();c.globalAlpha=clamp((t-(TL.duration-L))/L,0,1);c.drawImage(first,0,0);c.restore();
    return out.toDataURL(type,0.93);}
  await drawFrame(t);return out.toDataURL(type,0.93);
};
window.ready=Promise.all([document.fonts.load('700 40px P'),document.fonts.load('700 40px DJ')]).then(()=>true);
