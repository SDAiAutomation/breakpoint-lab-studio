<!doctype html>
<html><head><meta charset="utf-8">
<!-- Elevator engine (Breakpoint Lab, episode 016): the cable snaps, does jumping at the last second save you?
     The scene is rendered in Blender (Cycles, tools/blender/elevator_scene.py); this page simulates the fall, lays out
     the video (timeline), says which scene pose each frame shows, and draws the texts and the live speed readout.
     Physics: free fall, v = sqrt(2 g h). The rider falls WITH the car; a jump only gives him the jump speed upward,
     so his impact speed is the car's minus the jump speed. Jump speed 7 mph (C. S. Baird, West Texas A&M University,
     "Science Questions with Surprising Answers", 5 Dec 2012: 165 ft / about 15 floors, 3 floors = 33 ft).
     MythBusters ep. 17 "Elevator of Death" (2004): busted. The motion is a simulation ("Simulated"). -->
<style>
@font-face{font-family:P;src:url("fonts/Poppins-Bold.ttf");font-weight:700}
@font-face{font-family:DJ;src:url("fonts/DejaVuSans-Bold.ttf");font-weight:700}
html,body{margin:0;background:#000}canvas{display:block}
</style></head>
<body>
<canvas id="out" width="1080" height="1920"></canvas>
<script>
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const sm=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const lerp=(a,b,t)=>a+(b-a)*t;
const FPS=30;
const out=document.getElementById('out'),c=out.getContext('2d');const W=1080,H=1920;
const COL={green:'#1F9D55',red:'#E0303F',ink:'#1d2126',sub:'#5b636c',brand:'#F7C21A',blue:'#2F6FE0'};

// ---------------------------------------------------------------- physics (SI; car floor underside zc, buffers top z = 0.35)
const G=9.81, FLOOR=0.3048*11, BUF=0.35, CRUSH=0.15;   // one floor = 11 ft (165 ft = 15 floors, Baird 2012)
const VJ=7*0.44704;                                    // best human jump: 7 mph upward (Baird 2012)
const MPH=1/0.44704;
const PREP=0.30, PUSH=0.12, LEAD=0.08;                 // crouch 0.30 s, push 0.12 s, leaves the floor 0.08 s before impact (head clear of the roof)
function simulate(r){
  const n=r.floors, h=n*FLOOR, tf=Math.sqrt(2*h/G), vc=G*tf, jump=r.kind==='jump';
  const tj=tf-LEAD;                                    // jump: feet leave the floor
  const vImp=vc-(jump?VJ:0);                           // rider's speed when the car hits
  return {n,h,tf,vc,jump,tj,vImp,mph:Math.round(vImp*MPH),mphCar:Math.round(vc*MPH),
    car(u){                                            // car floor underside height (u = time since the snap)
      if(u<=0) return BUF+h;
      if(u<tf) return BUF+h-0.5*G*u*u;
      return BUF-CRUSH*sm(tf,tf+0.05,u);},
    rider(u){                                          // c crouch 0-1, arm (0 down, 1 up, <0 back), lean 0-1, dz lift above the floor
      let c0=0,arm=0,lean=0,dz=0;
      if(jump&&u>tj-PREP-PUSH&&u<tf){
        if(u<tj-PUSH){const k=sm(tj-PREP-PUSH,tj-PUSH,u);c0=0.75*k;arm=-0.35*k;}
        else if(u<tj){const k=sm(tj-PUSH,tj,u);c0=0.75*(1-k);arm=lerp(-0.35,0.6,k);}
        else {c0=0;arm=0.6;dz=VJ*(u-tj);}}
      const tc=jump?tf+VJ*LEAD/vImp:tf;                // rider meets the floor (jump: 17 ms after the car stops)
      if(u>=tf&&jump&&u<tc){c0=0;arm=0.6;dz=VJ*LEAD*(1-(u-tf)/(tc-tf));}
      if(u>=tc){const k=sm(tc,tc+0.28,u);c0=lerp(jump?0:0,1,k);lean=k;arm=lerp(jump?0.6:0,0.15,k);dz=0;}
      return {c:c0,arm,lean,dz};},
    speed(u){                                          // rider speed (m/s) shown live; held at the impact value
      if(u<=0) return 0;
      if(u>=tf) return vImp;
      let v=G*u;if(jump&&u>tj-PUSH) v-=VJ*sm(tj-PUSH,tj,u);return v;},
    carSpeed(u){return u<=0?0:G*Math.min(u,tf);}};
}

// ---------------------------------------------------------------- timeline
const D_={hook:2.4,hookPlay:2.1,title:1.3,setup:0.4,question:1.9,qFirst:1.6,keyGap:0.35,after:1.0,rpGap:0.25,
          stampGap:0.3,stampHold:0.9,fact:4.0,explainLead:0.8,line:3.2,explainTail:2.6,outro:7.5};
const RP_SLOW=0.2, RP_POST=0.3, HOOK_SKIP=21;   // hook = the same slow motion, frozen 0.02 s before the hit (rider in the air)
const CAM={off:1.30,d:20.0};                            // camera tracks the car: same framing all the time

function buildTimeline(cfg){
  const T={rounds:[],events:[]},ev=e=>T.events.push(e);
  let t=D_.hook;T.hook=[0,D_.hook];
  cfg.rounds.forEach((r,i)=>{
    const S=simulate(r);
    const R={cfg:r,i,S};
    R.start=t;ev({type:'round',t});
    R.titleEnd=t+D_.title;R.qStart=R.titleEnd+D_.setup;R.qEnd=R.qStart+(i===0?D_.qFirst:D_.question);
    ev({type:'question',t0:R.qStart,t1:R.qEnd});
    R.snapT=R.qEnd+D_.keyGap;ev({type:'snap',t:R.snapT,gain:1});
    R.hitT=R.snapT+S.tf;ev({type:'impact',t:R.hitT,gain:1});
    R.restT=R.hitT+0.45;R.afterEnd=R.restT+D_.after;
    R.rpA=S.tf-(S.jump?PREP+PUSH+LEAD+0.08:0.45);R.rpB=S.tf+RP_POST;   // fall time span shown in slow motion
    R.replayT0=R.afterEnd+D_.rpGap;R.replayT1=R.replayT0+(R.rpB-R.rpA)/RP_SLOW;
    ev({type:'replay',t0:R.replayT0,t1:R.replayT1});
    ev({type:'impact',t:R.replayT0+(S.tf-R.rpA)/RP_SLOW,gain:0.8,speed:RP_SLOW});
    R.stampT=R.replayT1+D_.stampGap;ev({type:'stamp',t:R.stampT,color:r.stamp.color});
    R.factT=R.stampT+D_.stampHold;ev({type:'card',t:R.factT});
    R.end=R.factT+D_.fact;t=R.end;
    T.rounds.push(R);
  });
  const nl=(cfg.explain.lines||[]).length, ex=D_.explainLead+nl*D_.line+D_.explainTail;
  T.explain=[t,t+ex];ev({type:'explain',t0:t,t1:t+ex});t+=ex;
  T.outro=[t,t+D_.outro];ev({type:'card',t});ev({type:'cta',t:t+1.4});t+=D_.outro;
  T.duration=t;
  T.events.sort((a,b)=>(a.t??a.t0)-(b.t??b.t0));
  return T;
}
const hookRound=(T,cfg)=>T.rounds[clamp((cfg.hook_round||1)-1,0,T.rounds.length-1)];

// ---------------------------------------------------------------- scene pose (what Blender renders for this frame)
const q=(x,s)=>Math.round(x/s)*s;
function pose(R,u){                                      // u = time since the snap (negative: hanging)
  const S=R.S, zc=S.car(u), rd=S.rider(u);
  const sway=u<0?0.012*Math.sin(u*5.2):0;                // hanging: a slight bounce on the cable
  const snap=u<0?0:Math.min(6,u*u*30+u*4);               // the cut cable whips up and away
  return {zc:zc+sway,cz:Math.max(zc,BUF-CRUSH)+CAM.off,d:CAM.d,c:rd.c,arm:rd.arm,lean:rd.lean,dz:rd.dz,
          cut:snap,buf:clamp((zc-(BUF-CRUSH))/CRUSH,0,1),v:S.speed(u),vcar:S.carSpeed(u),jump:S.jump,live:u>=0&&u<S.tf+0.5};
}
// every slow motion (hook, replay, WHY loop) uses the same time grid: the same Blender images serve all three
const STEP=RP_SLOW/FPS, slowU=(R,k)=>R.rpA+Math.min(Math.max(0,Math.round(k)),Math.round((R.rpB-R.rpA)/STEP))*STEP;
function poseAt(T,t){
  const HR=hookRound(T,CFG);
  if(t<T.hook[1]){                                        // hook: the slow motion of the jump, from frame 0; frozen in the air before the hit
    return pose(HR,slowU(HR,HOOK_SKIP+Math.min(t,D_.hookPlay)*FPS));}
  if(t>=T.explain[0]){                                    // WHY: the jump replays in slow motion behind the text (loops)
    if(t>=T.outro[0]) return pose(HR,HR.S.tf+1.0);
    const n=Math.round((HR.rpB-HR.rpA)/STEP), k=Math.round((t-T.explain[0])*FPS)%(n+60);
    return pose(HR,slowU(HR,k));}
  let R=T.rounds[0];for(const r of T.rounds) if(t>=r.start) R=r;
  if(t>=R.replayT0&&t<R.replayT1) return pose(R,slowU(R,(t-R.replayT0)*FPS));
  if(t>=R.replayT1) return pose(R,R.S.tf+1.0);
  return pose(R,t-R.snapT);
}
function poseKey(p){
  const f=(x,s,n)=>q(x,s).toFixed(n), st=p.live?0.01:0.005;
  return `z${f(p.zc,st,3)}_s${f(p.cut,0.05,2)}_c${f(p.c,0.02,2)}_a${f(p.arm,0.02,2)}_l${f(p.lean,0.02,2)}_h${f(p.dz,0.01,2)}_k${f(p.cz,0.01,2)}`;
}
function keyPose(p){
  const st=p.live?0.01:0.005;
  return {zc:q(p.zc,st),cut:q(p.cut,0.05),c:q(p.c,0.02),arm:q(p.arm,0.02),lean:q(p.lean,0.02),dz:q(p.dz,0.01),
          buf:clamp((q(p.zc,st)-(BUF-CRUSH))/CRUSH,0,1),cz:q(p.cz,0.01),d:p.d};
}

// ---------------------------------------------------------------- drawing helpers (same look as the other engines)
let DEC='.';
const fade=(t0,t,d=0.25)=>clamp((t-t0)/d,0,1);
const pop=(t0,t)=>{const k=clamp((t-t0)/0.25,0,1);return 1+0.18*Math.sin(k*Math.PI)*(1-k);};
function rrect(x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function panel(x,y,w,h,r,fill,a=1){if(a<=0)return;c.save();c.globalAlpha=a;c.fillStyle=fill;rrect(x,y,w,h,r);c.fill();c.restore();}
function fitText(s,maxW,size){c.font=`700 ${size}px P, DJ`;while(c.measureText(s).width>maxW&&size>18){size-=2;c.font=`700 ${size}px P, DJ`;}return size;}
function ctxt(s,x,y,size,color,a=1){if(a<=0)return;c.save();c.globalAlpha=a;c.font=`700 ${size}px P, DJ`;c.textAlign='center';c.textBaseline='middle';
  c.lineJoin='round';c.lineWidth=size*0.16;c.strokeStyle='rgba(255,255,255,0.85)';c.strokeText(s,x,y);
  c.shadowColor='rgba(0,0,0,0.18)';c.shadowBlur=size*0.12;c.shadowOffsetY=size*0.04;c.fillStyle=color;c.fillText(s,x,y);c.restore();}
function pill(s,x,y,size,fill,a=1){if(a<=0)return;const fs=size;c.font=`700 ${fs}px P, DJ`;const w=c.measureText(s).width+fs*1.1;
  panel(x-w/2,y-fs*0.85,w,fs*1.7,fs*0.85,fill,a);c.save();c.globalAlpha=a;c.font=`700 ${fs}px P, DJ`;c.textAlign='center';c.textBaseline='middle';c.fillStyle='#fff';c.fillText(s,x,y+1);c.restore();}
function drawHandle(cfg){
  if(!cfg.handle) return;
  c.save(); c.font='700 24px P, DJ'; c.textBaseline='middle'; c.textAlign='left';
  const tw=c.measureText(cfg.handle).width, gap=12, dot=7, y=256, x=W/2-(tw+gap+2*dot)/2;
  c.fillStyle='#f5c400'; c.beginPath(); c.arc(x+dot,y,dot,0,Math.PI*2); c.fill();
  c.lineWidth=2; c.strokeStyle='rgba(22,24,29,0.85)'; c.stroke();
  c.globalAlpha=0.8; c.fillStyle='#2a2e36'; c.fillText(cfg.handle,x+2*dot+gap,y+1); c.restore();
}
// live instrument: the rider's speed (simulated, v = g t; minus the jump), held at the impact value
// jump rounds: two readouts, the elevator and you (the jump takes 7 mph off yours, not the elevator's)
function speedo(x,y,p,a){
  if(a<=0) return;
  const hit=p.zc<=BUF+0.001, rows=p.jump?[['ELEVATOR',p.vcar,false],['YOU',p.v,hit]]:[[hit?'IMPACT':'SPEED',p.v,hit]];
  const h=rows.length*118+26;
  panel(x-130,y-59,260,h,26,'rgba(255,255,255,0.82)',a);
  c.save();c.globalAlpha=a;c.textAlign='center';c.textBaseline='middle';
  rows.forEach(([label,v,hot],i)=>{const yy=y+i*118;
    c.font='700 24px P, DJ';c.fillStyle=COL.sub;c.fillText(label,x,yy-27);
    c.font='700 60px P, DJ';c.fillStyle=hot?COL.red:COL.ink;c.fillText(String(Math.round(v*MPH)),x-24,yy+28);
    c.font='700 24px P, DJ';c.fillStyle=COL.sub;c.fillText('mph',x+74,yy+38);});
  c.restore();
}
function overlay(cfg,T,t,p){
  if(t>=T.hook[1]||cfg.hook_series!==false) ctxt(cfg.series,W/2,292,34,COL.sub,0.9);
  drawHandle(cfg);
  if(t<T.hook[1]){const a=1-fade(T.hook[1]-0.3,t,0.3),hn=cfg.hook.length;
    pill(cfg.replay_label||'SLOW-MO',W/2,640,28,'rgba(224,48,63,0.92)',a);
    cfg.hook.forEach((l,i)=>ctxt(l,W/2,400+i*95,fitText(l,960,84),hn>1&&i===hn-1?COL.red:COL.ink,a));return;}
  if(t<T.hook[1]+0.18){c.save();c.globalAlpha=1-fade(T.hook[1],t,0.18);c.fillStyle='#fff';c.fillRect(0,0,W,H);c.restore();}
  if(t<T.explain[0]){
    let R=T.rounds[0];for(const r of T.rounds) if(t>=r.start) R=r;const r=R.cfg, stampOn=t>=R.stampT;
    const inRp=t>=R.replayT0&&t<R.replayT1;
    if(t<R.titleEnd+0.2){const a=1-fade(R.titleEnd-0.1,t,0.3),pp=pop(R.start,t);c.save();c.translate(W/2,430);c.scale(pp,pp);ctxt(r.title,0,0,fitText(r.title,960,72),COL.ink,a);c.restore();}
    else if(t<R.qStart) {}
    else if(t<R.snapT-0.1){const a=fade(R.qStart,t)*(1-fade(R.snapT-0.2,t,0.1)),pp=1+0.05*Math.sin((t-R.qStart)*Math.PI*4);
      c.save();c.translate(W/2,415);c.scale(pp,pp);ctxt(r.question,0,0,fitText(r.question,960,92),COL.red,a);c.restore();
      ctxt(r.question_sub,W/2,515,fitText(r.question_sub,900,40),COL.ink,a);}   // gone before the cable snaps: one thing at a time
    const meterA=t>=R.titleEnd&&!stampOn&&!inRp?fade(R.titleEnd,t)*(1-fade(R.afterEnd,t,0.2)):0;
    if(meterA>0) pill(r.meter,W/2,628,30,R.S.jump?'rgba(47,111,224,0.92)':'rgba(91,99,108,0.92)',meterA);
    if(!stampOn&&t>=R.snapT-0.3) speedo(175,770,p,fade(R.snapT-0.3,t,0.25)*(1-fade(R.stampT-0.2,t,0.2)));
    if(inRp){const a=fade(R.replayT0,t,0.15)*(1-fade(R.replayT1-0.15,t,0.15));
      pill((cfg.replay_label||'SLOW-MO'),W/2,628,28,'rgba(224,48,63,0.92)',a);}
    if(stampOn){
      const k=clamp((t-R.stampT)/0.18,0,1),sc2=lerp(2.2,1,k*k)+(k>=1?0.05*Math.exp(-(t-R.stampT-0.18)*10)*Math.sin((t-R.stampT-0.18)*40):0);
      const col=r.stamp.color==='green'?COL.green:COL.red;
      c.save();c.translate(W/2,425);c.rotate(-0.08);c.scale(sc2,sc2);c.globalAlpha=Math.min(1,k*1.5);
      c.strokeStyle=col;c.lineWidth=10;rrect(-330,-72,660,144,22);c.stroke();c.fillStyle='rgba(255,255,255,0.7)';rrect(-330,-72,660,144,22);c.fill();
      const fs=fitText(r.stamp.text,600,84);c.font=`700 ${fs}px P, DJ`;c.textAlign='center';c.textBaseline='middle';c.fillStyle=col;c.fillText(r.stamp.text,0,5);c.restore();}
    if(t>=R.factT){const a=fade(R.factT,t,0.3)*(1-fade(R.end-0.25,t));(r.fact||[]).forEach((l,i)=>ctxt(l,W/2,555+i*50,fitText(l,980,38),COL.ink,a));}
    if(t<R.start+0.3){c.save();c.globalAlpha=1-fade(R.start,t,0.3);c.fillStyle='#fff';c.fillRect(0,0,W,H);c.restore();}
    return;}
  if(t<T.explain[0]+0.3){c.save();c.globalAlpha=1-fade(T.explain[0],t,0.3);c.fillStyle='#fff';c.fillRect(0,0,W,H);c.restore();}
  if(t<T.outro[0]){const e=cfg.explain,t0=T.explain[0],n=e.lines.length;
    ctxt(e.title,W/2,350,fitText(e.title,960,60),COL.ink,fade(t0,t));
    e.lines.forEach((l,i)=>ctxt(l,W/2,430+i*62,fitText(l,960,46),i===n-1?COL.red:COL.sub,fade(t0+D_.explainLead+i*D_.line,t,0.3)));
    speedo(175,770,p,fade(t0+D_.explainLead,t,0.4));   // the speeds replay with the slow motion under the explanation
    return;}
  const t0=T.outro[0];
  const nx=cfg.next_test, sw=nx?Math.min(2.6,(T.outro[1]-T.outro[0])*0.4):1e9, sa=fade(t0,t)*(1-fade(t0+sw,t,0.25));
  ctxt('SOURCE',W/2,345,28,COL.sub,sa);
  cfg.source.forEach((l,i)=>ctxt(l,W/2,395+i*48,fitText(l,980,32),COL.ink,sa));
  if(nx&&t>=t0+sw){const na=fade(t0+sw+0.1,t,0.25);ctxt(cfg.next_label||'NEXT TEST',W/2,345,30,COL.sub,na);ctxt(nx,W/2,425,fitText(nx,960,62),COL.red,na);}
  if(t>=t0+1.4){const a=fade(t0+1.4,t,0.25),pp=pop(t0+1.4,t);
    c.save();c.translate(W/2,560);c.scale(pp,pp);panel(-380,-50,760,100,50,COL.brand,a);
    c.font=`700 ${fitText(cfg.cta,700,42)}px P, DJ`;c.textAlign='center';c.textBaseline='middle';c.globalAlpha=a;c.fillStyle=COL.ink;c.fillText(cfg.cta,0,2);c.restore();}
}

// ---------------------------------------------------------------- scene images
const IMG={};
function loadImg(src){return new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src=src;});}
async function sceneImage(key){
  if(!(key in IMG)) IMG[key]=await loadImg((CFG.scene_dir||'../work/bscene')+'/'+key+'.jpg');
  return IMG[key];
}
function placeholder(key,p){                              // before the Blender render: a rough front view, so overlays can be checked
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#c9ced4');g.addColorStop(1,'#8d949c');c.fillStyle=g;c.fillRect(0,0,W,H);
  const s=1920/(0.4235*p.d), X=x=>W/2+x*s, Y=z=>H/2-(z-p.cz)*s;
  c.save();c.fillStyle='#bfc3c8';c.fillRect(X(-1.75),Y(0),X(1.75)-X(-1.75),0.48*s);
  c.strokeStyle='#6b7178';c.lineWidth=3;for(let k=1;k<=16;k++){const z=BUF+(k-1)*FLOOR;c.beginPath();c.moveTo(X(-1.75),Y(z));c.lineTo(X(1.75),Y(z));c.stroke();}
  c.fillStyle='#9aa1a8';c.fillRect(X(-0.8),Y(p.zc+2.3),1.6*s,2.3*s);c.fillStyle='#e9c46a';
  c.fillRect(X(-0.12),Y(p.zc+0.12+p.dz+1.75-0.6*p.c),0.24*s,(1.75-0.6*p.c)*s);
  c.restore();c.save();c.font='700 22px P, DJ';c.textAlign='center';c.fillStyle='#1d2126';c.fillText(key,W/2,1500);c.restore();
}

// ---------------------------------------------------------------- API used by render.js
let CFG=null,TL=null;
window.setup=function(cfg){CFG=cfg;DEC=cfg.decimal||'.';TL=buildTimeline(cfg);
  const seen=new Map();const N=Math.round(TL.duration*FPS);
  for(let i=0;i<N;i++){const p=poseAt(TL,i/FPS),k=poseKey(p);if(!seen.has(k)) seen.set(k,{key:k,...keyPose(p)});}
  return {duration:TL.duration,events:TL.events,poses:[...seen.values()],
          rounds:TL.rounds.map(R=>({title:R.cfg.title,floors:R.S.n,h:+R.S.h.toFixed(2),tf:+R.S.tf.toFixed(3),
            car_mph:R.S.mphCar,rider_mph:R.S.mph,snap:R.snapT,hit:R.hitT}))};};
window.poseKeyAt=t=>poseKey(poseAt(TL,t));
async function drawFrame(t){
  const p=poseAt(TL,t),key=poseKey(p),im=await sceneImage(key);
  let z=1;                                                // slow push-in on held images: the picture never freezes
  if(t>=TL.outro[0]) z=1+0.06*sm(TL.outro[0],TL.duration,t);
  else for(const R of TL.rounds) if(t>=R.stampT&&t<R.end) z=1+0.05*sm(R.stampT,R.end,t);
  else if(t>=R.start&&t<R.snapT) z=1+0.04*sm(R.start,R.snapT,t);
  let sy=0;for(const R of TL.rounds){const u=t-R.hitT;if(u>=0&&u<0.35) sy=18*Math.exp(-u*12)*Math.sin(u*70);}   // the hit shakes the camera
  if(im){c.imageSmoothingQuality='high';const zw=W*z,zh=H*z;c.drawImage(im,(W-zw)/2,(H-zh)*0.62+sy,zw,zh);} else placeholder(key,p);
  if(!window.CLEAN) overlay(CFG,TL,t,p);
}
window.renderFrame=async function(t,type='image/jpeg'){
  const L=0.45;
  if(t>TL.duration-L){
