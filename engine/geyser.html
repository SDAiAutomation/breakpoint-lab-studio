<!doctype html>
<html><head><meta charset="utf-8">
<!-- Geyser engine v2 (Breakpoint Lab "Physics" series): Mentos in Diet Coke, outdoors on concrete.
     Round "salt": rock salt dropped in, a short fizz (reaction 1.0 s in Coffey, Am. J. Phys. 2008). Round "mentos":
     the classic geyser (3.8 s). Round "micro": pH probe (3.0 before and after: not an acid/base reaction) then a zoom
     on the candy's rough surface where CO2 bubbles nucleate (442 nm rms roughness vs 174 nm for rock salt).
     Raymarched (WebGL): detailed 2 L PET bottle (petaloid base, ribs, threaded neck, generic label), foam column,
     foam running down the bottle, wet stain. Spray = ballistic foam particles drawn as motion-blurred sprites.
     Geyser shape and height are illustrative. -->
<style>
@font-face{font-family:P;src:url("fonts/Poppins-Bold.ttf");font-weight:700}
@font-face{font-family:DJ;src:url("fonts/DejaVuSans-Bold.ttf");font-weight:700}
html,body{margin:0;background:#000}canvas{display:block}
</style></head>
<body>
<canvas id="gl" width="1080" height="1920"></canvas>
<canvas id="out" width="1080" height="1920"></canvas>
<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 R;
uniform float camAng, camDist, camH, camTY, camF;
uniform vec2 shake;
uniform float mode;          // 0 bottle scene, 1 microscope
uniform float level;         // liquid level (m)
uniform vec4 jet;            // x top of the foam column (m), y radius at the mouth, z column growth (m), w jet time (s)
uniform vec3 ovf;            // x foam front running down the bottle (y, m), y coat thickness, z foam cap radius on the mouth
uniform float pool;          // foam pool radius around the base
uniform float wet;           // wet stain radius on the concrete
uniform float froth;         // cola turning to foam inside the bottle
uniform vec4 drop;           // dropped object: xyz + kind (1 mentos, 2 salt), w<0.5 hidden
uniform float tube, probe;   // paper tube visible, pH probe depth (0 hidden)
uniform float fizz;          // bubbles inside the bottle
uniform float tsec;
uniform vec4 bub[12];
uniform sampler2D logo, label;

const float MOUTH=0.390;
const vec3 SUN=vec3(-0.52,0.74,0.43);
float sdCylY(vec3 p, float h, float r){ vec2 d=abs(vec2(length(p.xz),p.y))-vec2(r,h); return min(max(d.x,d.y),0.0)+length(max(d,0.0)); }
float sdRoundBox(vec3 p, vec3 b, float r){ vec3 q=abs(p)-b; return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0)-r; }
float sdCone(vec3 p, float h, float r1, float r2){
  vec2 q=vec2(length(p.xz),p.y); vec2 k1=vec2(r2,h), k2=vec2(r2-r1,2.0*h);
  vec2 ca=vec2(q.x-min(q.x,(q.y<0.0)?r1:r2),abs(q.y)-h);
  vec2 cb=q-k1+k2*clamp(dot(k1-q,k2)/dot(k2,k2),0.0,1.0);
  float s=(cb.x<0.0&&ca.y<0.0)?-1.0:1.0; return s*sqrt(min(dot(ca,ca),dot(cb,cb)));
}
float smin(float a, float b, float k){ float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0); return mix(b,a,h)-k*h*(1.0-h); }
float hash3(vec3 p){ return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453); }
float noise(vec3 p){ vec3 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash3(i),hash3(i+vec3(1,0,0)),f.x),mix(hash3(i+vec3(0,1,0)),hash3(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash3(i+vec3(0,0,1)),hash3(i+vec3(1,0,1)),f.x),mix(hash3(i+vec3(0,1,1)),hash3(i+vec3(1,1,1)),f.x),f.y),f.z); }
float fbm(vec3 p){ return 0.5*noise(p)+0.25*noise(p*2.03+3.1)+0.125*noise(p*4.01+7.7); }
vec2 opU(vec2 a, vec2 b){ return a.x<b.x?a:b; }

// ------------------------------------------------ 2 L PET bottle: petaloid base, ribs, shoulder, neck ring, thread
float bottle(vec3 p){
  float a=atan(p.z,p.x), y=p.y;
  float foot=1.0-smoothstep(0.0,0.042,y);
  float rb=0.0545-foot*foot*(0.004+0.011*(0.5+0.5*cos(5.0*a)));
  rb-=0.0017*(smoothstep(0.0035,0.0,abs(y-0.058))+smoothstep(0.0035,0.0,abs(y-0.084))+smoothstep(0.0035,0.0,abs(y-0.222))+smoothstep(0.0035,0.0,abs(y-0.246)));
  float body=sdCylY(p-vec3(0.0,0.141,0.0),0.135,rb-0.006)-0.006;
  float sh=sdCone(p-vec3(0.0,0.3125,0.0),0.0425,0.055,0.0145);
  float rn=0.0140+(y>0.366?0.0010*smoothstep(-0.2,0.6,sin(a-y*1650.0)):0.0);
  float nk=sdCylY(p-vec3(0.0,0.3725,0.0),0.0175,rn);
  float ring=sdCylY(p-vec3(0.0,0.361,0.0),0.0011,0.0178)-0.0005;
  float d=smin(body,sh,0.014); d=smin(d,nk,0.005); d=min(d,ring);
  return d;
}
float jetD(vec3 p){                                       // foam column from the mouth to jet.x
  if(jet.x<MOUTH+0.003) return 1e5;
  float rxz=length(p.xz); if(rxz>0.16) return rxz-0.14;
  float yc=clamp(p.y,MOUTH,jet.x), s=(yc-MOUTH)/max(jet.z,0.2);
  float r=jet.y+0.075*pow(s,0.85);
  float n=0.62*noise(vec3(p.x*38.0,p.y*10.0-jet.w*15.0,p.z*38.0))+0.38*noise(vec3(p.x*105.0,p.y*34.0-jet.w*34.0,p.z*105.0));
  r*=0.72+0.56*n*(0.35+0.65*min(s*4.0,1.0));
  float top=jet.x-MOUTH;
  return (length(vec2(rxz,max(0.0,abs(p.y-MOUTH-top*0.5)-top*0.5)))-r)*0.55;
}
float coat(vec3 p, float b){                              // foam running down the outside of the bottle
  if(ovf.y<=0.0||b>0.02) return 1e5;
  float a=atan(p.z,p.x);
  float streak=smoothstep(0.56,0.70,noise(vec3(a*2.6,p.y*1.2,1.7))+0.12*noise(vec3(a*9.0,p.y*10.0,4.0)));
  float cover=mix(streak*0.8,1.0,smoothstep(0.31,0.36,p.y));
  float front=smoothstep(ovf.x-0.012,ovf.x+0.012,p.y+0.03*(noise(vec3(a*3.0,0.5,2.0))-0.5));
  float th=ovf.y*cover*front*(0.65+0.7*noise(p*140.0))-0.0015;
  return max(b-th,-b-0.0005);
}
float poolD(vec3 p, float b){                             // lumpy foam pool around the base
  if(pool<=0.0) return 1e5;
  float rr=length(p.xz), a=atan(p.z,p.x);
  float edge=pool*(0.80+0.25*noise(vec3(a*2.0,0.0,5.0))+0.10*noise(vec3(a*7.0,0.0,1.0)));
  float h=0.0015+0.006*smoothstep(edge,edge*0.35,rr)*(0.5+0.7*noise(vec3(p.x*45.0,0.0,p.z*45.0)));
  return max(max((p.y-h)*0.5,rr-edge),-(b-0.001));
}
float foamCap(vec3 p){
  if(ovf.z<=0.0) return 1e5;
  vec3 q=p-vec3(0.0,MOUTH+0.004,0.0); q.y*=1.25;
  return (length(q)-ovf.z*(0.85+0.3*noise(p*160.0+jet.w*3.0)))*0.7;
}
vec2 sceneMap(vec3 p, bool withGlass){
  vec2 res=vec2(p.y,1.0);
  float rxz=length(p.xz);
  float b=(rxz>0.085||p.y>0.45)?max(rxz-0.062,p.y-0.40):bottle(p);
  if(withGlass){ res=opU(res,vec2(abs(b)-0.0010,40.0));
    float rl=length(p.xz); res=opU(res,vec2(max(abs(rl-0.0560)-0.0004,abs(p.y-0.153)-0.052),48.0)); }   // label
  float liq=max(b+0.0016,p.y-level);
  res=opU(res,vec2(liq,41.0));
  float f=smin(jetD(p),foamCap(p),0.012);
  f=min(f,coat(p,b)); f=min(f,poolD(p,b));
  res=opU(res,vec2(f,42.0));
  if(length(p-vec3(0.14,0.0,0.085))>0.04) res=opU(res,vec2(length(p-vec3(0.14,0.0,0.085))-0.03,49.0)); else res=opU(res,vec2(max(sdCylY(p-vec3(0.14,0.0053,0.085),0.0052,0.0158+0.0004*sin(atan(p.z-0.085,p.x-0.14)*48.0))-0.0006,-sdCylY(p-vec3(0.14,0.0,0.085),0.0045,0.0135)),49.0));   // cap on the ground
  if(drop.w>0.5){
    vec3 q=p-drop.xyz;
    if(drop.w<1.5){ float d=(length(vec3(q.x,q.y*2.2,q.z))-0.0098)/2.2; d=smin(d,sdCylY(q,0.0028,0.0082)-0.0006,0.002); res=opU(res,vec2(d,43.0)); }
    else { for(int k=0;k<4;k++){ vec3 o=vec3(float(k)*0.006-0.009,float(k)*0.011,float(k-1)*0.004); res=opU(res,vec2(sdRoundBox(q-o,vec3(0.0032),0.0008),44.0)); } }
  }
  if(tube>0.5){ float d=max(abs(sdCylY(p-vec3(0.0,0.51,0.0),0.11,0.0170))-0.0006,-(p.y-0.40)); res=opU(res,vec2(d,45.0)); }
  if(probe>0.0){ float y0=0.41-probe; res=opU(res,vec2(sdCylY(p-vec3(0.004,(y0+0.68)*0.5,0.0),(0.68-y0)*0.5,0.005),46.0));
    res=opU(res,vec2(sdCylY(p-vec3(0.004,0.68,0.0),0.03,0.011),47.0)); }
  return res;
}
vec3 calcNormal(vec3 p){
  vec2 e=vec2(0.0004,-0.0004);
  return normalize(e.xyy*sceneMap(p+e.xyy,true).x+e.yyx*sceneMap(p+e.yyx,true).x+e.yxy*sceneMap(p+e.yxy,true).x+e.xxx*sceneMap(p+e.xxx,true).x);
}
float softShadow(vec3 ro, vec3 rd){
  vec2 o=ro.xz, dxz=rd.xz; float dd=dot(dxz,dxz);                 // all casters sit within 0.22 m of the bottle axis
  float sc=dd>1e-6?max(-dot(o,dxz)/dd,0.0):0.0; if(length(o+dxz*sc)>0.22) return 1.0;
  float res=1.0, t=0.004+0.008*hash3(ro*731.0), ph=1e10;
  float ytop=max(jet.x,0.70)+0.12;
  for(int i=0;i<52;i++){ vec3 q=ro+rd*t; if(q.y>ytop) break; float h=sceneMap(q,false).x;
    float y=h*h/(2.0*ph), d=sqrt(max(h*h-y*y,0.0)); res=min(res,10.0*d/max(0.0001,t-y)); ph=h;
    t+=clamp(h,0.004,0.25); if(res<0.002||t>5.0) break; }
  return clamp(res,0.0,1.0);
}
float calcAO(vec3 p, vec3 n){
  if(length(p.xz)>0.45) return 1.0;
  float occ=0.0, sca=1.0;
  for(int i=0;i<4;i++){ float h=0.006+0.035*float(i); occ+=(h-sceneMap(p+n*h,false).x)*sca; sca*=0.75; }
  return clamp(1.0-2.2*occ,0.0,1.0);
}
// ------------------------------------------------ outdoor sky with a far hedge line and trees
vec3 sky(vec3 rd){
  float e=rd.y;
  vec3 c=mix(vec3(0.86,0.90,0.93),vec3(0.50,0.67,0.88),smoothstep(0.0,0.55,e));
  c+=vec3(1.0,0.85,0.6)*0.25*pow(max(dot(rd,normalize(SUN)),0.0),12.0);
  float az=atan(rd.z,rd.x);
  float hh=0.020+0.018*noise(vec3(az*6.0,0.0,0.0))+0.010*noise(vec3(az*26.0,1.0,0.0))+0.035*smoothstep(0.55,0.85,noise(vec3(az*3.0,2.0,0.0)));
  if(e>-0.01&&e<hh){ float k=noise(vec3(az*140.0,e*400.0,0.0));
    c=mix(vec3(0.20,0.30,0.20),vec3(0.36,0.46,0.32),k)*mix(0.75,1.0,smoothstep(-0.01,hh,e));
    c=mix(c,vec3(0.80,0.85,0.88),0.45); }
  return c;
}
vec3 env(vec3 r){ return r.y>0.0?sky(r):mix(vec3(0.45,0.45,0.44),vec3(0.70,0.72,0.73),smoothstep(-0.4,0.0,r.y)); }
vec3 litSurface(vec3 p, vec3 n, vec3 rd, vec3 alb, float sp, float gl, float refl, float wrap){
  vec3 sun=normalize(SUN);
  float sh=softShadow(p+n*0.0015,sun), ndl=dot(n,sun), dif=clamp(ndl,0.0,1.0)*sh, ao=calcAO(p,n);
  float wr=clamp((ndl+wrap)/(1.0+wrap),0.0,1.0)*mix(0.35,1.0,sh)-dif;
  float amb=0.55+0.45*n.y;
  vec3 lin=1.55*dif*vec3(1.0,0.95,0.86)+0.55*amb*ao*vec3(0.78,0.86,1.0)+0.20*clamp(-n.y,0.0,1.0)*ao*vec3(0.75,0.72,0.68)+0.9*max(wr,0.0)*vec3(1.0,0.93,0.84)*ao;
  vec3 col=alb*lin;
  float fre=pow(1.0-clamp(dot(n,-rd),0.0,1.0),4.0);
  col=mix(col,env(reflect(rd,n))*(0.5+0.5*ao),refl*(0.35+0.65*fre));
  col+=sp*pow(clamp(dot(n,normalize(sun-rd)),0.0,1.0),gl)*dif*vec3(1.0,0.96,0.88);
  return col;
}
vec3 foamAlb(vec3 p){
  float cells=noise(p*420.0), big=noise(p*90.0);
  vec3 a=mix(vec3(0.93,0.88,0.80),vec3(0.80,0.68,0.52),0.45*smoothstep(0.35,0.85,big));
  return a*(0.86+0.22*smoothstep(0.2,0.8,cells));
}
vec3 concrete(vec3 p){
  vec3 a=vec3(0.60,0.60,0.58)*(0.90+0.14*fbm(p*vec3(3.0,0.0,3.0)))*(0.93+0.10*noise(p*vec3(90.0,0.0,90.0)));
  float sp=step(0.92,noise(p*vec3(260.0,0.0,260.0))); a*=1.0-0.18*sp;
  float jx=abs(fract(p.x/1.5+0.5)-0.5)*1.5, jz=abs(fract(p.z/1.5+0.5)-0.5)*1.5;
  a*=mix(0.78,1.0,smoothstep(0.002,0.005,min(jx,jz)));
  return a;
}
// ------------------------------------------------ microscope: chalky candy surface with pits, CO2 bubbles
float microH(vec3 p){ float h=0.10*noise(p*3.0)+0.05*noise(p*7.0)+0.025*noise(p*17.0)+0.010*noise(p*41.0);
  h-=0.09*smoothstep(0.60,0.82,noise(p*4.2+11.0))+0.04*smoothstep(0.62,0.85,noise(p*9.0+3.0)); return h; }
float microMap(vec3 p){ return (p.y-microH(p))*0.55; }
vec3 microNormal(vec3 p){ vec2 e=vec2(0.002,-0.002);
  return normalize(e.xyy*microMap(p+e.xyy)+e.yyx*microMap(p+e.yyx)+e.yxy*microMap(p+e.yxy)+e.xxx*microMap(p+e.xxx)); }
vec3 microShade(vec3 ro, vec3 rd){
  vec3 fogc=vec3(0.36,0.21,0.10);
  float t=0.0; bool hit=false;
  for(int i=0;i<170;i++){ float h=microMap(ro+rd*t); if(h<0.0005*t){hit=true;break;} t+=h; if(t>14.0) break; }
  vec3 col=mix(vec3(0.12,0.06,0.03),vec3(0.26,0.13,0.05),rd.y*0.5+0.5);
  if(hit){ vec3 p=ro+rd*t, n=microNormal(p), L=normalize(vec3(-0.4,0.9,0.5));
    float pit=smoothstep(0.0,-0.06,p.y-0.10*noise(p*3.0)-0.05*noise(p*7.0));
    vec3 alb=vec3(0.96,0.94,0.90)*(0.88+0.16*noise(p*60.0));
    float dif=clamp(dot(n,L),0.0,1.0), wr=clamp((dot(n,L)+0.5)/1.5,0.0,1.0);
    col=alb*(0.38+0.45*wr+0.75*dif)*vec3(1.0,0.97,0.92)*(1.0-0.30*pit);
    col+=0.15*pow(clamp(dot(reflect(rd,n),L),0.0,1.0),12.0);
    col=mix(col,fogc,1.0-exp(-t*0.055)); }
  float tb=1e9; vec3 bn=vec3(0.0);
  for(int i=0;i<12;i++){ vec4 b=bub[i]; if(b.w<=0.0) continue; vec3 oc=ro-b.xyz; float bb=dot(oc,rd), cc=dot(oc,oc)-b.w*b.w, hh=bb*bb-cc;
    if(hh>0.0){ float tt=-bb-sqrt(hh); if(tt>0.0&&tt<tb&&(!hit||tt<t)){ tb=tt; bn=normalize(ro+rd*tt-b.xyz); } } }
  if(tb<1e8){ float fre=pow(1.0-abs(dot(bn,rd)),2.5);
    vec3 inside=col*vec3(1.10,1.05,0.98);
    vec3 c=mix(inside,vec3(0.10,0.05,0.02),smoothstep(0.35,0.95,fre)*0.85);
    vec3 r=reflect(rd,bn);
    c+=vec3(1.6)*pow(clamp(dot(r,normalize(vec3(-0.4,0.9,0.5))),0.0,1.0),90.0)+vec3(0.6,0.5,0.4)*pow(clamp(dot(r,normalize(vec3(0.6,0.3,0.7))),0.0,1.0),40.0);
    c+=vec3(0.35,0.25,0.15)*smoothstep(0.75,1.0,fre);
    col=mix(c,fogc,1.0-exp(-tb*0.055)); }
  return col;
}
// ------------------------------------------------ main scene
vec3 shade(vec2 fc){
  vec2 uv=(2.0*fc-R)/R.y;
  vec3 ta=vec3(0.0,camTY,0.0);
  vec3 ro=ta+vec3(sin(camAng)*camDist,camH,cos(camAng)*camDist);
  ro.xy+=shake; ta.xy+=shake*0.6;
  vec3 ww=normalize(ta-ro), uu=normalize(cross(ww,vec3(0,1,0))), vv=cross(uu,ww);
  vec3 rd=normalize(uv.x*uu+uv.y*vv+camF*ww);
  if(mode>0.5) return microShade(ro,rd);
  vec3 acc=vec3(0.0), thr=vec3(1.0);
  float t=0.0; bool glassPass=true; vec3 haze=vec3(0.84,0.88,0.91);
  for(int pass=0;pass<4;pass++){
    vec2 h=vec2(0.0); bool hit=false; vec3 p;
    for(int i=0;i<220;i++){ p=ro+rd*t; h=sceneMap(p,glassPass); if(h.x<0.00015*t+0.00008){hit=true;break;} t+=h.x*0.9; if(t>45.0) break; }
    if(!hit){ acc+=thr*sky(rd); break; }
    float m=h.y; vec3 n=m<1.5?vec3(0.0,1.0,0.0):calcNormal(p);
    if(m>39.5&&m<40.5){                                    // clear PET: reflection, slight tint, condensation dots
      float fre=0.04+0.96*pow(1.0-abs(dot(n,rd)),5.0);
      float dew=step(0.90,noise(p*900.0))*step(p.y,level+0.01);
      acc+=thr*(env(reflect(rd,n))*fre*0.9+vec3(0.9)*dew*0.18);
      thr*=(1.0-fre)*vec3(0.94,0.97,0.96);
      t+=0.003; if(pass>=1) glassPass=false; continue;
    }
    vec3 col;
    if(m<1.5){                                             // concrete, wet stain, painted logo
      vec3 alb=concrete(p);
      vec2 lu=vec2((p.x+0.42)/0.84,(0.78-p.z)/0.14);
      if(lu.x>0.0&&lu.x<1.0&&lu.y>0.0&&lu.y<1.0){ float lg=texture2D(logo,vec2(lu.x,1.0-lu.y)).a*(0.75+0.25*noise(p*80.0)); alb=mix(alb,lu.x>0.735?vec3(0.85,0.62,0.05):vec3(0.93,0.93,0.90),lg*0.55); }
      float rr=length(p.xz), a=atan(p.z,p.x);
      float wm=0.0;
      if(wet>0.0){ float edge=wet*(0.55+0.65*fbm(vec3(p.x*3.0,0.0,p.z*3.0)));
        wm=(1.0-smoothstep(edge*0.45,edge,rr))*(0.55+0.45*smoothstep(0.3,0.7,fbm(vec3(p.x*9.0,1.0,p.z*9.0))));
        wm=max(wm,step(0.83,noise(vec3(p.x*30.0,0.0,p.z*30.0)))*(1.0-smoothstep(edge*0.8,edge*1.5,rr))*0.8*step(0.05,wet)); }
      alb*=mix(vec3(1.0),vec3(0.66,0.58,0.50),wm);
      vec3 nn=normalize(n+wm*0.0);
      col=litSurface(p,nn,rd,alb,0.08+0.9*wm,30.0+150.0*wm,0.05+0.18*wm,0.0);
    }
    else if(m<41.5){                                       // cola: dark, glossy, amber where thin, bubbles, froth
      vec3 alb=vec3(0.14,0.06,0.025);
      float cl=step(0.955,noise(p*vec3(650.0,650.0,650.0)));
      float bb=step(0.90,noise(vec3(p.x*520.0,p.y*520.0-tsec*9.0,p.z*520.0)));
      alb=mix(alb,vec3(0.72,0.55,0.38),cl*0.35+bb*fizz*0.55);
      float fr=froth*smoothstep(0.0,0.20,p.y-(level-0.22));
      alb=mix(alb,foamAlb(p)*0.85,fr);
      col=litSurface(p,n,rd,alb,1.6*(1.0-fr),120.0,0.12*(1.0-fr),0.25*fr);
      float edge=pow(1.0-abs(dot(n,rd)),1.6);

function drawSpray(s){
  if(!s.parts.length) return;
  const B=camBasis(s);
  const axis=project(B,0,0.2,0), zAxis=axis?axis[2]:1e9;
  const pr=[];
  for(const q of s.parts){
    const a=project(B,q.x,q.y,q.z); if(!a) continue;
    const rp=q.r*B.f*960/a[2]; if(a[0]<-60||a[0]>1140||a[1]<-60||a[1]>1980) continue;
    if(a[2]>zAxis){                                        // behind the bottle or the column: hidden by its silhouette
      const yb=q.ground?0.01:q.y;
      if(yb<0.39){const ax=project(B,0,yb,0);const hw=(yb<0.28?0.056:0.02)*B.f*960/ax[2];if(Math.abs(a[0]-ax[0])<hw-rp*0.5) continue;}
      else if(s.G.jet[0]>0&&yb<s.G.jet[0]){const ax=project(B,0,yb,0);const sc=(yb-MOUTH)/s.G.H;const hw=(JR0+JG*Math.pow(Math.max(sc,0),0.85))*B.f*960/ax[2];if(Math.abs(a[0]-ax[0])<hw*0.8) continue;}
    }
    pr.push({q,a,rp});
  }
  pr.sort((u,v)=>v.a[2]-u.a[2]);
  c.save();
  for(const {q,a,rp} of pr){
    const spr=q.dark?SPR_D:SPR_L, R2=Math.max(rp,0.8);
    if(q.ground){ c.globalAlpha=0.85*q.ground; c.drawImage(spr,a[0]-R2*1.3,a[1]-R2*0.45,R2*2.6,R2*0.9); continue; }
    const b=project(B,q.x-q.vx*q.sh,q.y-q.vy*q.sh,q.z-q.vz*q.sh);
    const len=b?Math.hypot(a[0]-b[0],a[1]-b[1]):0, n=Math.min(14,Math.max(1,Math.ceil(len/(R2*0.35))));
    c.globalAlpha=Math.min(0.9,(R2<1.5?0.6:0.85)*(n>1?Math.min(1,2.2/n):1));
    for(let k=0;k<n;k++){const f=n>1?k/(n-1):0, px=b?lerp(a[0],b[0],f):a[0], py=b?lerp(a[1],b[1],f):a[1];
      c.drawImage(spr,px-R2,py-R2,R2*2,R2*2);}
  }
  c.restore();
}

// ---------------------------------------------------------------- overlay
const out=document.getElementById('out'),c=out.getContext('2d');const W=1080,H=1920;
const COL={green:'#1F9D55',red:'#E0303F',ink:'#1d2126',sub:'#5b636c',brand:'#F7C21A'};
const fade=(t0,t,d=0.25)=>clamp((t-t0)/d,0,1);
const pop=(t0,t)=>{const k=clamp((t-t0)/0.25,0,1);return 1+0.18*Math.sin(k*Math.PI)*(1-k);};
function rrect(x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function panel(x,y,w,h,r,fill,a=1){if(a<=0)return;c.save();c.globalAlpha=a;c.fillStyle=fill;rrect(x,y,w,h,r);c.fill();c.restore();}
function fitText(s,maxW,size){c.font=`700 ${size}px P, DJ`;while(c.measureText(s).width>maxW&&size>18){size-=2;c.font=`700 ${size}px P, DJ`;}return size;}
function ctxt(s,x,y,size,color,a=1){if(a<=0)return;c.save();c.globalAlpha=a;c.font=`700 ${size}px P, DJ`;c.textAlign='center';c.textBaseline='middle';
  c.lineJoin='round';c.lineWidth=size*0.16;c.strokeStyle='rgba(255,255,255,0.85)';c.strokeText(s,x,y);
  c.shadowColor='rgba(0,0,0,0.18)';c.shadowBlur=size*0.12;c.shadowOffsetY=size*0.04;c.fillStyle=color;c.fillText(s,x,y);c.restore();}
function pill(s,x,y,size,fill,a=1){if(a<=0)return;const fs=size;c.font=`700 ${fs}px P, DJ`;const w=c.measureText(s).width+fs*1.1;
  panel(x-w/2,y-fs*0.85,w,fs*1.7,fs*0.85,fill,a);c.save();c.globalAlpha=a;c.font=`700 ${fs}px P, DJ`;c.textAlign='center';c.textBaseline='middle';c.fillStyle='#fff';c.fillText(s,x,y+1);c.restore();}
function meter(label,val,x,y,a){
  if(a<=0) return;panel(x-150,y-70,300,140,18,'#1d2126',a);panel(x-135,y-55,270,110,12,'#cfe8d0',a);
  c.save();c.globalAlpha=a;c.font='700 26px P, DJ';c.textAlign='center';c.fillStyle='#2a3a2c';c.fillText(label,x,y-28);
  c.font='700 58px DJ';c.fillText(val,x,y+30);c.restore();
}
function overlay(cfg,T,t,s){
  const R=s.R, r=R.cfg;
  { const gr=c.createLinearGradient(0,0,0,690);gr.addColorStop(0,'rgba(236,240,243,0.92)');gr.addColorStop(0.72,'rgba(236,240,243,0.74)');gr.addColorStop(1,'rgba(236,240,243,0)');
    c.save();c.fillStyle=gr;c.fillRect(0,0,W,690);c.restore(); }
  if(t>=T.hook[1]||cfg.hook_series!==false) ctxt(cfg.series,W/2,292,34,COL.sub,0.9);
  drawHandle(c,cfg);
  if(t<T.hook[1]){const a=1-fade(T.hook[1]-0.3,t,0.3);cfg.hook.forEach((l,i)=>ctxt(l,W/2,390+i*90,fitText(l,960,82),COL.ink,a));return;}
  if(t<T.hook[1]+0.18){c.save();c.globalAlpha=1-fade(T.hook[1],t,0.18);c.fillStyle='#fff';c.fillRect(0,0,W,H);c.restore();}
  if(t<T.explain[0]){
    const stampOn=t>=R.stampT;
    if(t<R.titleEnd+0.2){const a=1-fade(R.titleEnd-0.1,t,0.3),p=pop(R.start,t);c.save();c.translate(W/2,430);c.scale(p,p);ctxt(r.title,0,0,fitText(r.title,960,76),COL.ink,a);c.restore();}
    else if(R.showEnd&&t<R.qStart){ if(r.subtitle) ctxt(r.subtitle,W/2,430,fitText(r.subtitle,960,52),COL.ink,fade(R.titleEnd,t)); }
    else if(t<R.qEnd){const a=fade(R.qStart,t)*(1-fade(R.qEnd-0.15,t,0.15)),p=1+0.05*Math.sin((t-R.qStart)*Math.PI*4);
      c.save();c.translate(W/2,415);c.scale(p,p);ctxt(r.question,0,0,fitText(r.question,960,96),COL.red,a);c.restore();
      ctxt(r.question_sub,W/2,515,fitText(r.question_sub,900,40),COL.ink,a);
      const n=Math.ceil(R.qEnd-t);if(n>=1&&n<=3&&t>R.qEnd-3) ctxt(String(n),W/2,590,56,COL.ink,a);}
    else if(r.kind==='micro'&&!stampOn){
      if(t<R.zoom[0]){const a=fade(R.ph[0],t);meter(r.ph_before_label||'BEFORE',r.ph_before||'pH 3.0',W/2-170,470,a);meter(r.ph_after_label||'AFTER',r.ph_after||'pH 3.0',W/2+170,470,fade(R.ph[0]+1.4,t));}
      else {ctxt(r.zoom_text||'Mentos surface, zoomed in',W/2,400,fitText(r.zoom_text||'',960,50),COL.ink,fade(R.zoom[0],t));
        if(r.zoom_fact) ctxt(r.zoom_fact,W/2,480,fitText(r.zoom_fact,960,44),COL.sub,fade(R.zoom[0]+1.2,t));}}
    else if(!stampOn&&!s.replay&&R.hit&&t>=R.go){
      const tt=Math.max(0,Math.min(t-R.hit,R.dur));
      ctxt(r.timer_label||'ERUPTION',W/2,360,30,COL.sub);ctxt(tt.toFixed(1)+' s',W/2,445,100,t-R.hit>=R.dur?COL.green:COL.ink);}
    if(s.replay){const a=fade(R.replayT0,t,0.15)*(1-fade(R.replayT1-0.15,t,0.15));
      c.save();c.globalAlpha=a*0.9;c.fillStyle='#000';c.fillRect(0,640,W,16);c.fillRect(0,1424,W,16);c.restore();
      pill((cfg.replay_label||'SLOW-MO')+' ×'+Math.round(1/SLOW),W/2,700,28,'rgba(224,48,63,0.92)',a);}
    if(stampOn){
      const k=clamp((t-R.stampT)/0.18,0,1),sc2=lerp(2.2,1,k*k)+(k>=1?0.05*Math.exp(-(t-R.stampT-0.18)*10)*Math.sin((t-R.stampT-0.18)*40):0);
      const col=r.stamp.color==='green'?COL.green:COL.red;
      c.save();c.translate(W/2,425);c.rotate(-0.08);c.scale(sc2,sc2);c.globalAlpha=Math.min(1,k*1.5);
      c.strokeStyle=col;c.lineWidth=10;rrect(-300,-72,600,144,22);c.stroke();c.fillStyle='rgba(255,255,255,0.7)';rrect(-300,-72,600,144,22);c.fill();
      const fs=fitText(r.stamp.text,540,84);c.font=`700 ${fs}px P, DJ`;c.textAlign='center';c.textBaseline='middle';c.fillStyle=col;c.fillText(r.stamp.text,0,5);c.restore();}
    if(t>=R.factT){const a=fade(R.factT,t,0.3)*(1-fade(R.end-0.25,t));(r.fact||[]).forEach((l,i)=>ctxt(l,W/2,555+i*50,fitText(l,980,38),COL.ink,a));}
    if(t<R.start+0.3){c.save();c.globalAlpha=1-fade(R.start,t,0.3);c.fillStyle='#fff';c.fillRect(0,0,W,H);c.restore();}
    return;}
  if(t<T.explain[0]+0.3){c.save();c.globalAlpha=1-fade(T.explain[0],t,0.3);c.fillStyle='#fff';c.fillRect(0,0,W,H);c.restore();}
  if(t<T.outro[0]){const e=cfg.explain,t0=T.explain[0];
    ctxt(e.title,W/2,370,fitText(e.title,960,64),COL.ink,fade(t0,t));
    e.lines.forEach((l,i)=>ctxt(l,W/2,450+i*54,fitText(l,960,40),i===e.lines.length-1?COL.green:COL.sub,fade(t0+0.8+i*2.0,t,0.3)));return;}
  const t0=T.outro[0];
  ctxt('SOURCE',W/2,345,28,COL.sub,fade(t0,t));
  cfg.source.forEach((l,i)=>ctxt(l,W/2,395+i*48,fitText(l,980,32),COL.ink,fade(t0,t)));
  if(t>=t0+1.4){const a=fade(t0+1.4,t,0.25),p=pop(t0+1.4,t);
    c.save();c.translate(W/2,560);c.scale(p,p);panel(-380,-50,760,100,50,COL.brand,a);
    c.font=`700 ${fitText(cfg.cta,700,42)}px P, DJ`;c.textAlign='center';c.textBaseline='middle';c.globalAlpha=a;c.fillStyle=COL.ink;c.fillText(cfg.cta,0,2);c.restore();}
}

// ---------------------------------------------------------------- API used by render.js
let CFG=null,TL=null;
window.setup=function(cfg){if(!LOGO){LOGO=makeLogoTexture();LABEL=makeLabelTexture();gl.uniform1i(U.logo,0);gl.uniform1i(U.label,1);}CFG=cfg;TL=buildTimeline(cfg);
  return {duration:TL.duration,events:TL.events,rounds:TL.rounds.map(R=>({title:R.cfg.title}))};};
function sceneTime(t){
  if(t<TL.hook[1]){const R=TL.rounds.find(q=>q.rw);return R.hit-0.3+t;}   // hook: the real eruption, in full action
  return t;
}
window.renderFrame=function(t,type='image/jpeg'){drawFrame(t);return out.toDataURL(type,0.93);};
function drawFrame(t){
  const st=sceneTime(t), s=sceneState(TL,st), G=s.G;
  gl.viewport(0,0,1080,1920);gl.uniform2f(U.R,1080,1920);
  gl.uniform1f(U.camAng,s.camAng);gl.uniform1f(U.camDist,s.camDist);gl.uniform1f(U.camH,s.camH);gl.uniform1f(U.camTY,s.camTY);gl.uniform1f(U.camF,s.camF);
  gl.uniform2f(U.shake,s.shake[0],s.shake[1]);
  gl.uniform1f(U.mode,s.mode);gl.uniform1f(U.level,G.level);
  gl.uniform4f(U.jet,...G.jet);gl.uniform3f(U.ovf,...G.ovf);gl.uniform1f(U.pool,G.pool);gl.uniform1f(U.wet,G.wet);gl.uniform1f(U.froth,G.froth);
  gl.uniform4f(U.drop,...s.drop);gl.uniform1f(U.tube,s.tube);gl.uniform1f(U.probe,s.probe);gl.uniform1f(U.fizz,s.fizz);gl.uniform1f(U.tsec,st);
  const B=new Float32Array(48);s.bub.forEach((b,i)=>B.set(b,i*4));gl.uniform4fv(U.bub,B);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,LOGO);gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,LABEL);
  gl.drawArrays(gl.TRIANGLES,0,3);gl.finish();
  c.imageSmoothingQuality='high';c.drawImage(document.getElementById('gl'),0,0,W,H);
  if(s.mode===0) drawSpray(s);
  overlay(CFG,TL,t,s);
}
window.ready=Promise.all([document.fonts.load('700 40px P'),document.fonts.load('700 40px DJ')]).then(()=>true);
